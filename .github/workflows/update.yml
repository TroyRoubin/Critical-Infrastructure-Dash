      - name: Enable multi-select LGA filter
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_multi_lga.py <<'PY'
          from __future__ import annotations
          
          from pathlib import Path
          import re
          
          INDEX = Path("index.html")
          MARKER = "Multi-LGA filter v4"
          
          CSS_ANCHOR = """    .field input,.field select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:9px;background:#091620;color:var(--text);padding:9px 10px}
          """
          
          CSS_BLOCK = r"""    /* Multi-LGA filter v4 */
              .lga-multi{position:relative;margin-top:5px}
              .lga-multi-trigger{
                width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
                border:1px solid var(--line);border-radius:9px;background:#091620;color:var(--text);
                padding:9px 10px;cursor:pointer;text-align:left;font-weight:700
              }
              .lga-multi-trigger:hover{border-color:var(--line-strong);background:#0d1d29}
              .lga-multi-trigger-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
              .lga-multi-chevron{flex:0 0 auto;color:var(--muted);font-size:15px;line-height:1;transition:transform .15s ease}
              .lga-multi-trigger[aria-expanded="true"] .lga-multi-chevron{transform:rotate(180deg)}
              .lga-multi-menu{
                position:absolute;z-index:1600;left:0;right:0;top:calc(100% + 6px);
                max-height:min(360px,52vh);overflow:auto;padding:6px;border:1px solid var(--line-strong);
                border-radius:10px;background:#091620;box-shadow:0 18px 40px rgba(0,0,0,.38);
                scrollbar-color:#385366 transparent
              }
              .lga-multi-menu[hidden]{display:none}
              .lga-clear{
                width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
                border:0;border-radius:7px;background:transparent;color:var(--text);
                padding:8px 9px;cursor:pointer;text-align:left;font-size:11px;font-weight:800
              }
              .lga-clear:hover,.lga-clear.active{background:#102534}
              .lga-clear small{color:var(--quiet);font-weight:650}
              .lga-option{
                display:flex;align-items:center;gap:9px;border-radius:7px;color:var(--text);
                padding:7px 9px;cursor:pointer;font-size:11px;font-weight:700
              }
              .lga-option:hover{background:#102534}
              .lga-option input{
                appearance:auto;width:15px;height:15px;min-width:15px;margin:0;padding:0;
                border:0;border-radius:3px;accent-color:#4db8e8;cursor:pointer
              }
              .lga-option span{min-width:0}
              html[data-theme="light"] .lga-multi-trigger,
              html[data-theme="light"] .lga-multi-menu{background:#f8fbfd}
              html[data-theme="light"] .lga-multi-trigger:hover,
              html[data-theme="light"] .lga-clear:hover,
              html[data-theme="light"] .lga-clear.active,
              html[data-theme="light"] .lga-option:hover{background:#e9f2f6}
          """
          
          OLD_HTML = """            <label class="field">LGA
                        <select id="lgaFilter"><option value="">All Queensland</option></select>
                      </label>"""
          
          NEW_HTML = """            <div class="field">LGA
                        <div class="lga-multi" id="lgaFilterWrap">
                          <button class="lga-multi-trigger" type="button" id="lgaFilterButton"
                                  aria-haspopup="listbox" aria-expanded="false" aria-controls="lgaFilterMenu">
                            <span class="lga-multi-trigger-text" id="lgaFilterText">All Queensland</span>
                            <span class="lga-multi-chevron" aria-hidden="true">⌄</span>
                          </button>
                          <div class="lga-multi-menu" id="lgaFilterMenu" role="listbox"
                               aria-label="Select one or more LGAs" aria-multiselectable="true" hidden>
                            <button class="lga-clear active" type="button" id="lgaClear">
                              <span>All Queensland</span><small>Clear selections</small>
                            </button>
                            <div id="lgaOptions"></div>
                          </div>
                        </div>
                      </div>"""
          
          OLD_STATE = """    const state = {
                sectors:new Set(Object.keys(SECTORS)),
                lga:'',
                search:'',
                selectedId:null
              };"""
          
          NEW_STATE = """    const state = {
                sectors:new Set(Object.keys(SECTORS)),
                lgas:new Set(),
                search:'',
                selectedId:null
              };"""
          
          OLD_MATCHER = """    function incidentMatchesLga(incident,lga){
                return !lga || incidentLgaNames(incident).includes(lga);
              }"""
          
          NEW_MATCHER = r"""    function incidentMatchesLgas(incident,lgas){
                if(!lgas || !lgas.size) return true;
                const names = incidentLgaNames(incident);
                return [...lgas].some(lga => names.includes(lga));
              }
          
              function lgaSelectionLabel(){
                const selected = [...state.lgas].sort((a,b) => a.localeCompare(b));
                if(!selected.length) return 'All Queensland';
                if(selected.length === 1) return selected[0];
                return `${selected.length} LGAs selected`;
              }
          
              function syncLgaControls(){
                const text = document.getElementById('lgaFilterText');
                const button = document.getElementById('lgaFilterButton');
                const clear = document.getElementById('lgaClear');
                if(text) text.textContent = lgaSelectionLabel();
                if(button){
                  button.title = state.lgas.size
                    ? [...state.lgas].sort((a,b) => a.localeCompare(b)).join(', ')
                    : 'All Queensland';
                }
                if(clear) clear.classList.toggle('active', state.lgas.size === 0);
                document.querySelectorAll('#lgaOptions input[type="checkbox"]').forEach(input => {
                  input.checked = state.lgas.has(input.value);
                });
              }
          
              function fitSelectedLgas(){
                if(!lgaLayer) return;
                if(!state.lgas.size){
                  map.fitBounds(lgaLayer.getBounds(),{padding:[10,10]});
                  return;
                }
                const bounds = L.latLngBounds([]);
                lgaLayer.eachLayer(layer => {
                  const name = layer.feature?.properties?.display_name;
                  if(name && state.lgas.has(name)) bounds.extend(layer.getBounds());
                });
                if(bounds.isValid()) map.fitBounds(bounds,{padding:[28,28]});
              }"""
          
          OLD_MAP_CLICK = """          layer.on('click',() => {
                      state.lga = feature.properties.display_name;
                      document.getElementById('lgaFilter').value = state.lga;
                      map.fitBounds(layer.getBounds(),{padding:[24,24]});
                      render();
                    });"""
          
          NEW_MAP_CLICK = """          layer.on('click',() => {
                      const name = feature.properties.display_name;
                      if(state.lgas.has(name)) state.lgas.delete(name);
                      else state.lgas.add(name);
                      syncLgaControls();
                      fitSelectedLgas();
                      render();
                    });"""
          
          NEW_OPTIONS_BLOCK = r"""    const lgaOptions = document.getElementById('lgaOptions');
              OFFICIAL_LGA_NAMES.forEach(name => {
                const option = document.createElement('label');
                option.className = 'lga-option';
          
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = name;
                checkbox.setAttribute('aria-label', name);
                checkbox.addEventListener('change',event => {
                  if(event.target.checked) state.lgas.add(name);
                  else state.lgas.delete(name);
                  syncLgaControls();
                  fitSelectedLgas();
                  render();
                });
          
                const text = document.createElement('span');
                text.textContent = name;
                option.append(checkbox,text);
                lgaOptions.appendChild(option);
              });
          
              const lgaButton = document.getElementById('lgaFilterButton');
              const lgaMenu = document.getElementById('lgaFilterMenu');
              const lgaWrap = document.getElementById('lgaFilterWrap');
          
              function setLgaMenuOpen(open){
                lgaMenu.hidden = !open;
                lgaButton.setAttribute('aria-expanded', String(open));
              }
          
              lgaButton.addEventListener('click',event => {
                event.stopPropagation();
                setLgaMenuOpen(lgaMenu.hidden);
              });
          
              document.getElementById('lgaClear').addEventListener('click',event => {
                event.stopPropagation();
                state.lgas.clear();
                syncLgaControls();
                fitSelectedLgas();
                render();
              });
          
              document.addEventListener('click',event => {
                if(!lgaWrap.contains(event.target)) setLgaMenuOpen(false);
              });
              document.addEventListener('keydown',event => {
                if(event.key === 'Escape') setLgaMenuOpen(false);
              });
          
              syncLgaControls();
          
          """
          
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Multi-LGA patch expected exactly one {label}; found {count}. "
                      "index.html may have changed."
                  )
              return text.replace(old, new, 1)
          
          
          def apply(text: str) -> tuple[str, bool]:
              if MARKER in text:
                  validate(text)
                  return text, False
          
              text = replace_once(
                  text,
                  CSS_ANCHOR,
                  CSS_ANCHOR + "\n" + CSS_BLOCK,
                  "LGA field CSS anchor",
              )
              text = replace_once(text, OLD_HTML, NEW_HTML, "single-select LGA HTML")
              text = replace_once(text, OLD_STATE, NEW_STATE, "single-LGA state")
              text = replace_once(text, OLD_MATCHER, NEW_MATCHER, "single-LGA matcher")
          
              text = replace_once(
                  text,
                  "incidentMatchesLga(incident,state.lga)",
                  "incidentMatchesLgas(incident,state.lgas)",
                  "context LGA filter",
              )
              text = replace_once(
                  text,
                  "const selected = state.lga === name;",
                  "const selected = state.lgas.has(name);",
                  "selected LGA map style",
              )
              text = replace_once(text, OLD_MAP_CLICK, NEW_MAP_CLICK, "LGA map click handler")
              text = replace_once(
                  text,
                  "const locationScope = state.lga ? ` · ${state.lga}` : '';",
                  "const locationScope = state.lgas.size ? ` · ${lgaSelectionLabel()}` : '';",
                  "incident scope label",
              )
              text = replace_once(
                  text,
                  "const locationText = state.lga || 'Queensland';",
                  "const locationText = state.lgas.size ? lgaSelectionLabel() : 'Queensland';",
                  "map scope label",
              )
          
              options_pattern = re.compile(
                  r"    OFFICIAL_LGA_NAMES\.forEach\(name => \{.*?"
                  r"(?=    document\.getElementById\('search'\)\.addEventListener)",
                  re.S,
              )
              text, count = options_pattern.subn(NEW_OPTIONS_BLOCK, text, count=1)
              if count != 1:
                  raise SystemExit(
                      f"Multi-LGA patch expected one LGA options/change-listener block; found {count}."
                  )
          
              text = replace_once(
                  text,
                  "      state.lga = '';",
                  "      state.lgas.clear();",
                  "reset LGA state",
              )
              text = replace_once(
                  text,
                  "      document.getElementById('lgaFilter').value = '';",
                  "      syncLgaControls();",
                  "reset LGA control",
              )
          
              validate(text)
              return text, True
          
          
          def validate(text: str) -> None:
              required = (
                  MARKER,
                  'id="lgaFilterButton"',
                  'id="lgaFilterMenu"',
                  'id="lgaOptions"',
                  "lgas:new Set()",
                  "incidentMatchesLgas(incident,state.lgas)",
                  "state.lgas.has(name)",
                  "state.lgas.clear();",
                  "syncLgaControls();",
              )
              for token in required:
                  if token not in text:
                      raise SystemExit(f"Multi-LGA patch validation failed: missing {token!r}")
          
              forbidden = (
                  'id="lgaFilter"',
                  "getElementById('lgaFilter')",
                  "incidentMatchesLga(incident,state.lga)",
              )
              for token in forbidden:
                  if token in text:
                      raise SystemExit(
                          f"Multi-LGA patch validation failed: old single-select token remains: {token!r}"
                      )
          
              if re.search(r"\bstate\.lga\b", text):
                  raise SystemExit(
                      "Multi-LGA patch validation failed: an old state.lga reference remains."
                  )
          
          
          def main() -> int:
              if not INDEX.exists():
                  raise SystemExit("index.html was not found.")
          
              original = INDEX.read_text(encoding="utf-8")
              patched, changed = apply(original)
              if changed:
                  INDEX.write_text(patched, encoding="utf-8")
                  print("Enabled multi-select LGA filtering.")
              else:
                  print("Multi-select LGA filtering is already enabled.")
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          python /tmp/apply_multi_lga.py


      - name: Enrich Marine warning details
        shell: bash
        run: |
