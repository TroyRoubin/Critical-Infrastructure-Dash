name: Refresh and deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - refresh.py
      - requirements.txt
      - .github/workflows/update.yml
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qld-dashboard-main
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get latest repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Apply QLDTraffic Queensland-only filter
        shell: bash
        run: |
          set -euo pipefail

          GOOD_REFRESH_COMMIT="a30369b2f3308aaad9fb448744a9f6aa0411e38f"

          repair_refresh() {
            if [[ ! -f refresh.py ]]; then
              echo "refresh.py is missing; restoring known-good version."
              git show "${GOOD_REFRESH_COMMIT}:refresh.py" > refresh.py
              return
            fi

            if grep -q 'Apply the Critical Infrastructure Dashboard QLDTraffic KPI fix' refresh.py; then
              echo "refresh.py contains the old patch-helper; restoring dashboard refresher."
              git show "${GOOD_REFRESH_COMMIT}:refresh.py" > refresh.py
              return
            fi

            if ! grep -q 'Refresh the data embedded in index.html' refresh.py; then
              echo "refresh.py does not look like the dashboard refresher; restoring it."
              git show "${GOOD_REFRESH_COMMIT}:refresh.py" > refresh.py
            fi
          }

          cat > /tmp/apply_qldtraffic_filter.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re

          path = Path("refresh.py")
          text = path.read_text(encoding="utf-8")

          marker = "# QLDTraffic filter: Hazard + Flooding only"
          qld_marker = "# Queensland-only road geography filter"

          new_roads = r'''
          # QLDTraffic filter: Hazard + Flooding only
          # Queensland-only road geography filter
          QLDTRAFFIC_ALLOWED_EVENT_CATEGORIES = {"hazard", "flooding"}

          # Fast coarse bounds used before the exact Queensland LGA check.
          # Coordinates are GeoJSON order: [longitude, latitude].
          QLDTRAFFIC_QLD_BOUNDS = {
              "min_lon": 137.8,
              "max_lon": 153.7,
              "min_lat": -29.25,
              "max_lat": -9.0,
          }


          def qldtraffic_event_category(properties: dict[str, Any]) -> str | None:
              category = norm(properties.get("event_type"))
              return category if category in QLDTRAFFIC_ALLOWED_EVENT_CATEGORIES else None


          def qldtraffic_in_qld_bounds(point: list[float] | None) -> bool:
              if not point or len(point) < 2:
                  return False
              lon, lat = float(point[0]), float(point[1])
              return (
                  QLDTRAFFIC_QLD_BOUNDS["min_lon"] <= lon <= QLDTRAFFIC_QLD_BOUNDS["max_lon"]
                  and QLDTRAFFIC_QLD_BOUNDS["min_lat"] <= lat <= QLDTRAFFIC_QLD_BOUNDS["max_lat"]
              )


          def qldtraffic_coordinate_in_queensland(
              point: list[float] | None,
              lgas: dict[str, Any],
          ) -> tuple[bool, str | None]:
              if not qldtraffic_in_qld_bounds(point):
                  return False, None

              # When the embedded Queensland LGA polygons are available, use
              # them as the authoritative state-boundary test.
              if lgas.get("features"):
                  lga = locate_lga(point, lgas)
                  return (lga is not None), lga

              # If LGA geometry is temporarily unavailable, retain the coarse
              # Queensland bounding-box safeguard rather than displaying
              # obviously interstate records.
              return True, None


          def qldtraffic_location_in_queensland(
              geometry: dict[str, Any] | None,
              lgas: dict[str, Any],
          ) -> tuple[list[float] | None, str | None]:
              # Try the representative point first. For line/polygon events near
              # a border, also sample several actual geometry vertices so a
              # centroid outside Queensland does not discard a valid QLD event.
              candidates: list[list[float]] = []

              representative = representative_point(geometry)
              if representative:
                  candidates.append(representative)

              points = all_points(geometry)
              if points:
                  indexes = (
                      0,
                      len(points) // 4,
                      len(points) // 2,
                      (3 * len(points)) // 4,
                      len(points) - 1,
                  )
                  for index in indexes:
                      point = points[index]
                      if point not in candidates:
                          candidates.append(point)

              for point in candidates:
                  inside, lga = qldtraffic_coordinate_in_queensland(point, lgas)
                  if inside:
                      return point, lga

              return None, None


          def qldtraffic_fallback_records(
              records: list[dict[str, Any]],
              lgas: dict[str, Any],
          ) -> list[dict[str, Any]]:
              # Cached road records must satisfy BOTH the event-category filter
              # and the Queensland geography filter.
              filtered = []
              for item in records:
                  category = norm(item.get("event_category") or item.get("event_type"))
                  if category not in QLDTRAFFIC_ALLOWED_EVENT_CATEGORIES:
                      continue

                  inside, _ = qldtraffic_coordinate_in_queensland(
                      item.get("coordinates"),
                      lgas,
                  )
                  if inside:
                      filtered.append(item)

              return filtered


          def parse_roads(payload: dict[str, Any], lgas: dict[str, Any]) -> list[dict[str, Any]]:
              incidents = []

              for feature in payload.get("features", []):
                  props = feature.get("properties") or {}

                  # KPI inclusion filter: QLDTraffic Hazards + Flooding only.
                  event_category = qldtraffic_event_category(props)
                  if event_category is None:
                      continue

                  if norm(props.get("status")) not in {"", "active", "published"}:
                      continue

                  duration = props.get("duration") or {}
                  if not active_now(duration.get("start"), duration.get("end")):
                      continue

                  summary = props.get("road_summary") or {}
                  geometry = feature.get("geometry")

                  # Map/state inclusion filter: Queensland only.
                  coords, qld_lga = qldtraffic_location_in_queensland(geometry, lgas)
                  if coords is None:
                      continue

                  impact = props.get("impact") or {}
                  impact_type = clean(impact.get("impact_type"))
                  impact_subtype = clean(impact.get("impact_subtype"))
                  combined = norm(f"{impact_type} {impact_subtype}")

                  if "closure" in combined or "closed" in combined:
                      subtype = "closure"
                  elif "lane" in combined or "restriction" in combined:
                      subtype = "restriction"
                  else:
                      subtype = "incident"

                  # Prefer the LGA proved by the Queensland polygon check.
                  lga = qld_lga or clean(summary.get("local_government_area"))
                  road = clean(summary.get("road_name")) or "Queensland road"

                  event_type = clean(props.get("event_type")) or title_case(event_category)
                  event_subtype = clean(props.get("event_subtype"))
                  event_due_to = clean(props.get("event_due_to"))
                  status = impact_subtype or impact_type or event_subtype or event_type

                  incidents.append({
                      "id": f"roads-{props.get('id') or stable_id(road, event_type, duration.get('start'))}",
                      "sector": "roads",
                      "subtype": subtype,
                      "event_category": event_category,
                      "event_type": event_type,
                      "event_subtype": event_subtype,
                      "event_due_to": event_due_to,
                      "title": f"{road}: {status or event_type}",
                      "description": clean(props.get("description")),
                      "status": status,
                      "lga": lga,
                      "locality": clean(summary.get("locality")),
                      "coordinates": coords,
                      "geometry": geometry,
                      "customers": 0,
                      "planned": False,
                      "updated": iso(props.get("last_updated")) or NOW_ISO,
                      "source_name": "QLDTraffic",
                      "source_url": clean(props.get("url") or props.get("web_link"))
                          or SOURCES["qldtraffic"]["url"],
                  })

              return incidents


          '''

          # If the earlier Hazard/Flooding block is already present, replace the
          # entire block with this Queensland-only version. This makes v3 update
          # an existing v2 installation rather than silently doing nothing.
          if marker in text:
              block_pattern = re.compile(
                  r"(?ms)^# QLDTraffic filter: Hazard \+ Flooding only\n.*?"
                  r"(?=^def property_value\()"
              )
              match = block_pattern.search(text)
              if not match:
                  raise SystemExit("Could not locate the existing QLDTraffic filter block.")
              text = text[:match.start()] + new_roads + text[match.end():]
          else:
              parse_pattern = re.compile(
                  r"(?ms)^def parse_roads\([^\n]*\)"
                  r"(?:\s*->\s*[^:\n]+)?"
                  r":\n.*?"
                  r"(?=^def [A-Za-z_][A-Za-z0-9_]*\(|\Z)"
              )
              match = parse_pattern.search(text)
              if not match:
                  raise SystemExit("Could not locate parse_roads() in refresh.py.")
              text = text[:match.start()] + new_roads + text[match.end():]

          # Upgrade the cached QLDTraffic fallback to apply the same QLD boundary
          # check. This also cleans out any previously embedded interstate roads.
          text = text.replace(
              "qldtraffic_fallback_records(previous_by_source.get(key, []))",
              "qldtraffic_fallback_records(previous_by_source.get(key, []), lgas)",
          )

          if "qldtraffic_fallback_records(previous_by_source.get(key, []), lgas)" not in text:
              fallback_pattern = re.compile(
                  r"(?m)^(?P<indent>[ \t]+)fallback = previous_by_source\.get\(key, \[\]\)[ \t]*$"
              )
              match = fallback_pattern.search(text)
              if not match:
                  raise SystemExit("Could not locate the source fallback in refresh.py.")

              indent = match.group("indent")
              replacement = (
                  f"{indent}fallback = (\n"
                  f"{indent}    qldtraffic_fallback_records(previous_by_source.get(key, []), lgas)\n"
                  f'{indent}    if key == "qldtraffic"\n'
                  f"{indent}    else previous_by_source.get(key, [])\n"
                  f"{indent})"
              )
              text = text[:match.start()] + replacement + text[match.end():]

          required = [
              marker,
              qld_marker,
              '"event_category": event_category',
              'QLDTRAFFIC_ALLOWED_EVENT_CATEGORIES = {"hazard", "flooding"}',
              "qldtraffic_location_in_queensland(geometry, lgas)",
              "qldtraffic_fallback_records(previous_by_source.get(key, []), lgas)",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"QLDTraffic patch validation failed: missing {token}")

          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          print("QLDTraffic filter applied: Hazard + Flooding, Queensland only.")
          PY

          repair_refresh
          python /tmp/apply_qldtraffic_filter.py
          python -m py_compile refresh.py

      - name: Apply Marine Warnings KPI
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_marine_kpi.py <<'PY'
          #!/usr/bin/env python3
          """Add the MSQ Marine Warnings KPI to the Critical Infrastructure Dashboard.
          
          This is an idempotent repository patcher. It updates both refresh.py and
          index.html while deliberately leaving the existing QLDTraffic, Queensland-only,
          multi-LGA and dashboard-title patches untouched.
          
          Marine data is fetched from the public Maritime Safety Queensland dashboard.
          Because that site is a JavaScript application, the parser is intentionally
          fail-closed: a zero is accepted only when the returned document explicitly says
          there are no current maritime/marine warnings. If the public page exposes only
          its application shell, refresh.py raises an error so the dashboard displays the
          source as unavailable (or keeps a previously verified fallback) instead of
          showing a false zero.
          """
          from __future__ import annotations
          
          from pathlib import Path
          import re
          
          ROOT = Path.cwd()
          REFRESH = ROOT / "refresh.py"
          INDEX = ROOT / "index.html"
          
          REFRESH_MARKER = "# Marine Warnings KPI: Maritime Safety Queensland v1"
          INDEX_MARKER = "/* Marine Warnings KPI v1 */"
          MSQ_URL = "https://qldmaritime.msq.qld.gov.au/"
          
          
          MARINE_PARSER_BLOCK = r'''
          # Marine Warnings KPI: Maritime Safety Queensland v1
          MSQ_NO_WARNING_PHRASES = (
              "no current maritime warnings",
              "no active maritime warnings",
              "there are no current maritime warnings",
              "there are no active maritime warnings",
              "no current marine warnings",
              "no active marine warnings",
              "there are no current marine warnings",
              "there are no active marine warnings",
          )
          
          MSQ_GENERIC_WARNING_LABELS = {
              "marine warning",
              "marine warnings",
              "maritime warning",
              "maritime warnings",
              "warnings",
              "current warnings",
              "maritime safety queensland",
              "opt in notifications",
          }
          
          
          class _MSQVisibleTextParser(HTMLParser):
              """Extract visible text lines without executing dashboard JavaScript."""
          
              _BREAK_TAGS = {
                  "address", "article", "aside", "br", "dd", "div", "dl", "dt",
                  "figcaption", "footer", "h1", "h2", "h3", "h4", "h5", "h6",
                  "header", "li", "main", "nav", "p", "section", "table", "td",
                  "th", "tr", "ul",
              }
          
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.parts: list[str] = []
                  self._skip_depth = 0
          
              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  tag = tag.lower()
                  if tag in {"script", "style"}:
                      self._skip_depth += 1
                      return
                  if not self._skip_depth and tag in self._BREAK_TAGS:
                      self.parts.append("\n")
          
              def handle_endtag(self, tag: str) -> None:
                  tag = tag.lower()
                  if tag in {"script", "style"}:
                      self._skip_depth = max(0, self._skip_depth - 1)
                      return
                  if not self._skip_depth and tag in self._BREAK_TAGS:
                      self.parts.append("\n")
          
              def handle_data(self, data: str) -> None:
                  if not self._skip_depth:
                      self.parts.append(data)
          
              def lines(self) -> list[str]:
                  return [clean(line) for line in "".join(self.parts).splitlines() if clean(line)]
          
          
          def _msq_warning_candidate(value: Any) -> str | None:
              text = clean(html.unescape(str(value or "")))
              if len(text) < 12 or len(text) > 500:
                  return None
          
              key = norm(text)
              if not key or key in MSQ_GENERIC_WARNING_LABELS:
                  return None
              if key.startswith("opt in notification") or key in {"sign in", "register"}:
                  return None
          
              # Strong phrases that identify an operational maritime warning rather than
              # a navigation label or general preparedness link on the dashboard shell.
              strong_phrases = (
                  "port closed",
                  "port closure",
                  "pilotage area closed",
                  "waterway closed",
                  "closed to vessel traffic",
                  "closed to all vessel traffic",
                  "navigation warning",
                  "hazard to navigation",
                  "marine warning in place",
                  "marine warnings in place",
                  "maritime warning in place",
                  "maritime warnings in place",
                  "extreme weather warning",
                  "red alert",
                  "orange alert",
                  "yellow alert",
                  "white alert",
              )
              if any(phrase in key for phrase in strong_phrases):
                  return text
          
              # Also accept a descriptive warning sentence when it contains both a
              # maritime subject and an active/impact qualifier.
              maritime_terms = (
                  "port", "pilotage", "waterway", "navigation", "harbour", "harbor",
                  "vessel", "marine", "maritime", "cyclone", "storm", "swell", "flood",
              )
              active_terms = (
                  "active", "current", "closed", "closure", "hazard", "danger",
                  "alert", "issued", "effective", "restricted", "restriction",
              )
              if "warning" in key and any(term in key for term in maritime_terms) and any(term in key for term in active_terms):
                  return text
          
              return None
          
          
          def _msq_unique_candidates(values: list[str]) -> list[str]:
              candidates = []
              for value in values:
                  candidate = _msq_warning_candidate(value)
                  if candidate:
                      candidates.append(candidate)
          
              # Prefer concise card/title text when a longer captured block contains the
              # same warning. This avoids counting one dashboard card multiple times.
              unique: list[tuple[str, str]] = []
              for candidate in sorted(candidates, key=lambda item: (len(item), item.lower())):
                  key = norm(candidate)
                  if any(key == existing or (len(key) >= 24 and (key in existing or existing in key)) for existing, _ in unique):
                      continue
                  unique.append((key, candidate))
          
              if len(unique) > 40:
                  raise RuntimeError(
                      "MSQ dashboard warning extraction was ambiguous (more than 40 candidate blocks); "
                      "refusing to publish a potentially misleading KPI."
                  )
              return [candidate for _, candidate in unique]
          
          
          def parse_msq_marine_warnings(html_data: bytes) -> list[dict[str, Any]]:
              """Parse active warnings from the public MSQ dashboard, failing closed.
          
              A verified explicit no-warning message is the only condition that produces
              a trustworthy zero. If the server returns only the JavaScript application
              shell, raise so source health reports the feed as unavailable rather than 0.
              """
              raw = html_data.decode("utf-8-sig", errors="replace")
              if not clean(raw):
                  raise RuntimeError("MSQ dashboard returned an empty response")
          
              parser = _MSQVisibleTextParser()
              parser.feed(raw)
              visible_lines = parser.lines()
              visible_key = norm(" ".join(visible_lines))
          
              if any(phrase in visible_key for phrase in MSQ_NO_WARNING_PHRASES):
                  return []
          
              # Some Guardian/QIT dashboard deployments place public card payloads in
              # script/JSON strings even when the main page is client-rendered. Inspect
              # string values as a secondary path, without executing any JavaScript.
              script_strings = []
              for match in re.finditer(r"[\"']([^\"'\r\n]{12,500})[\"']", raw):
                  value = match.group(1)
                  if "warning" in value.lower() or "alert" in value.lower() or "closed" in value.lower():
                      script_strings.append(value.replace(r"\u0026", "&").replace(r"\/", "/"))
          
              warnings = _msq_unique_candidates(visible_lines + script_strings)
              if not warnings:
                  shell_key = norm(raw)
                  if "maritime safety queensland" in shell_key or "powered by qit plus" in shell_key:
                      raise RuntimeError(
                          "MSQ dashboard returned its application shell, but the active maritime-warning state "
                          "was not present in the server response"
                      )
                  raise RuntimeError("Unable to verify the active maritime-warning state from the MSQ dashboard")
          
              incidents = []
              for warning in warnings:
                  title = warning if len(warning) <= 170 else warning[:167].rstrip() + "…"
                  description = "" if title == warning else warning
                  incidents.append({
                      "id": f"marine-{stable_id(warning)}",
                      "sector": "marine",
                      "subtype": "warning",
                      "event_category": "maritime warning",
                      "title": title,
                      "description": description,
                      "status": "Active maritime warning",
                      "lga": None,
                      "locality": "Queensland maritime network",
                      "coordinates": None,
                      "geometry": None,
                      "customers": 0,
                      "planned": False,
                      "updated": NOW_ISO,
                      "source_name": "Maritime Safety Queensland",
                      "source_url": SOURCES["marine"]["url"],
                  })
              return incidents
          
          
          '''
          
          
          INDEX_CSS_BLOCK = r'''    /* Marine Warnings KPI v1 */
              .focus-lga-kpi{
                flex:0 0 auto;display:flex;align-items:center;gap:9px;min-width:112px;
                padding:7px 9px;border:1px solid rgba(165,140,242,.42);border-radius:10px;
                background:rgba(165,140,242,.12);box-shadow:inset 3px 0 0 #a58cf2
              }
              .focus-lga-kpi-label{color:#cbbdfb;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.15}
              .focus-lga-kpi-value{color:#cbbdfb;font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
              html[data-theme="light"] .focus-lga-kpi{background:rgba(112,83,205,.08);border-color:rgba(112,83,205,.3)}
              html[data-theme="light"] .focus-lga-kpi-label,html[data-theme="light"] .focus-lga-kpi-value{color:#6749b8}
          '''
          
          MARINE_CARD = '''        <article class="metric" style="--tone:var(--marine)" data-kpi-sector="marine" role="button" tabindex="0" aria-label="Toggle marine warnings">
                    <div class="metric-label">Marine warnings</div>
                    <div class="metric-value" id="marineValue">—</div>
                    <div class="metric-detail" id="marineDetail">MSQ status pending</div>
                  </article>
          '''
          
          LGA_BADGE = '''          <div class="focus-lga-kpi" title="Queensland LGAs affected within the current filters" aria-label="LGAs affected within current filters">
                      <span class="focus-lga-kpi-label">LGAs<br>affected</span>
                      <strong class="focus-lga-kpi-value" id="lgaValue">0</strong>
                    </div>
          '''
          
          
          METRIC_ARTICLE_PATTERN = re.compile(
              r'''(?ms)^[ \t]*<article\b[^>]*>.*?</article>[ \t]*(?:\n|$)'''
          )


          def replace_top_lga_card(text: str) -> str:
              """Replace the existing top-row LGA KPI without depending on its styling.

              Earlier workflow versions changed the card's tone, attributes and initial
              value, so matching the full HTML block made this patch unnecessarily
              brittle. The stable identifiers are the lgaValue element and its visible
              "LGAs affected" label.
              """
              matches = []
              for match in METRIC_ARTICLE_PATTERN.finditer(text):
                  block = match.group(0)
                  has_value = re.search(r'''\bid=["']lgaValue["']''', block, re.I)
                  has_label = re.search(r'''>\s*LGAs\s+affected\s*<''', block, re.I)
                  if has_value and has_label:
                      matches.append(match)

              if len(matches) != 1:
                  raise RuntimeError(
                      "Marine KPI patch expected one top-row LGAs affected card "
                      f"identified by lgaValue; found {len(matches)}."
                  )

              match = matches[0]
              return text[:match.start()] + MARINE_CARD + text[match.end():]
          
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Marine KPI patch expected exactly one {label}; found {count}.")
              return text.replace(old, new, 1)
          
          
          def patch_refresh(text: str) -> tuple[str, bool]:
              if REFRESH_MARKER in text:
                  validate_refresh(text)
                  return text, False
          
              if 'from html.parser import HTMLParser' not in text:
                  text = replace_once(
                      text,
                      "import html\n",
                      "import html\nfrom html.parser import HTMLParser\n",
                      "html import anchor",
                  )
          
              if '"marine": {' not in text:
                  geography_anchor = '    "geography": {\n'
                  marine_source = (
                      '    "marine": {\n'
                      '        "name": "Maritime Safety Queensland",\n'
                      f'        "url": "{MSQ_URL}",\n'
                      '    },\n'
                  )
                  text = replace_once(
                      text,
                      geography_anchor,
                      marine_source + geography_anchor,
                      "SOURCES geography anchor",
                  )
          
              text = replace_once(
                  text,
                  "\ndef read_embedded() -> dict[str, Any]:\n",
                  "\n" + MARINE_PARSER_BLOCK + "def read_embedded() -> dict[str, Any]:\n",
                  "read_embedded anchor",
              )
          
              rail_job = '        ("rail", lambda: parse_rail(get_bytes(SOURCES["rail"]["url"]))),\n'
              marine_job = '        ("marine", lambda: parse_msq_marine_warnings(get_bytes(SOURCES["marine"]["url"]))),\n'
              text = replace_once(text, rail_job, rail_job + marine_job, "rail job anchor")
          
              validate_refresh(text)
              return text, True
          
          
          def validate_refresh(text: str) -> None:
              required = (
                  REFRESH_MARKER,
                  '"marine": {',
                  '"name": "Maritime Safety Queensland"',
                  f'"url": "{MSQ_URL}"',
                  'def parse_msq_marine_warnings(html_data: bytes)',
                  '"sector": "marine"',
                  '("marine", lambda: parse_msq_marine_warnings(get_bytes(SOURCES["marine"]["url"]))),',
                  'raise RuntimeError("Unable to verify the active maritime-warning state from the MSQ dashboard")',
              )
              for token in required:
                  if token not in text:
                      raise RuntimeError(f"Marine refresh patch validation failed: missing {token!r}.")
              compile(text, str(REFRESH), "exec")
          
          
          def patch_index(text: str) -> tuple[str, bool]:
              if INDEX_MARKER in text:
                  validate_index(text)
                  return text, False
          
              # Add a distinct marine sector colour while keeping the five-card KPI grid.
              text = replace_once(
                  text,
                  "      --schools-soft:rgba(72,199,142,.13);\n",
                  "      --schools-soft:rgba(72,199,142,.13);\n"
                  "      --marine:#35c6bb;\n"
                  "      --marine-soft:rgba(53,198,187,.14);\n",
                  "schools colour variables",
              )
          
              css_anchor = "    .metric-detail{margin-top:4px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n"
              text = replace_once(text, css_anchor, css_anchor + "\n" + INDEX_CSS_BLOCK, "metric-detail CSS anchor")
          
              text = replace_top_lga_card(text)
          
              focus_anchor = '''            <div class="panel-subtitle">Filter active disruptions by location, sector, or search term</div>
                    </div>
                  </div>
                  <div class="filter-body">
          '''
              focus_replacement = '''            <div class="panel-subtitle">Filter active disruptions by location, sector, or search term</div>
                    </div>
          ''' + LGA_BADGE + '''        </div>
                  <div class="filter-body">
          '''
              text = replace_once(text, focus_anchor, focus_replacement, "Operational focus header")
          
              sectors_anchor = "      schools: {label:'Schools', symbol:'S', colour:'#48c78e', soft:'rgba(72,199,142,.14)'}\n"
              sectors_replacement = (
                  "      schools: {label:'Schools', symbol:'S', colour:'#48c78e', soft:'rgba(72,199,142,.14)'},\n"
                  "      marine: {label:'Marine', symbol:'M', colour:'#35c6bb', soft:'rgba(53,198,187,.14)'}\n"
              )
              text = replace_once(text, sectors_anchor, sectors_replacement, "SECTORS schools entry")
          
              source_anchor = "      schools:'https://closures.qld.edu.au/'\n"
              source_replacement = (
                  "      schools:'https://closures.qld.edu.au/',\n"
                  f"      marine:'{MSQ_URL}'\n"
              )
              text = replace_once(text, source_anchor, source_replacement, "official source schools entry")
          
              summary_anchor = "      const nonStateSchools = schools.filter(i => String(i.school_sector || '').toLowerCase() !== 'state');\n"
              summary_insert = summary_anchor + (
                  "      const marine = context.filter(i => i.sector === 'marine');\n"
                  "      const marineSource = DASHBOARD_DATA.sources?.marine || {};\n"
              )
              text = replace_once(text, summary_anchor, summary_insert, "renderSummary school calculation")
          
              school_dom_anchor = "      document.getElementById('schoolDetail').textContent = `${fmt(stateSchools.length)} state · ${fmt(nonStateSchools.length)} non-state`;\n"
              marine_dom = school_dom_anchor + (
                  "      const marineValue = document.getElementById('marineValue');\n"
                  "      const marineDetail = document.getElementById('marineDetail');\n"
                  "      const marineVerified = marineSource.status === 'current' || marineSource.status === 'fallback';\n"
                  "      marineValue.textContent = marineVerified ? fmt(marine.length) : '—';\n"
                  "      marineDetail.textContent = marineSource.status === 'fallback'\n"
                  "        ? 'cached MSQ snapshot'\n"
                  "        : marineSource.status === 'current'\n"
                  "          ? `${fmt(marine.length)} active warning${marine.length === 1 ? '' : 's'}`\n"
                  "          : 'MSQ unavailable';\n"
              )
              text = replace_once(text, school_dom_anchor, marine_dom, "renderSummary school DOM update")
          
              validate_index(text)
              return text, True
          
          
          def validate_index(text: str) -> None:
              required = (
                  INDEX_MARKER,
                  '--marine:#35c6bb;',
                  'data-kpi-sector="marine"',
                  'id="marineValue"',
                  'id="marineDetail"',
                  'class="focus-lga-kpi"',
                  'id="lgaValue"',
                  "marine: {label:'Marine'",
                  f"marine:'{MSQ_URL}'",
                  "const marineSource = DASHBOARD_DATA.sources?.marine || {};",
                  "'MSQ unavailable'",
              )
              for token in required:
                  if token not in text:
                      raise RuntimeError(f"Marine index patch validation failed: missing {token!r}.")
          
              if text.count('id="marineValue"') != 1:
                  raise RuntimeError("Marine index patch validation failed: marineValue must occur exactly once.")
              if text.count('id="lgaValue"') != 1:
                  raise RuntimeError("Marine index patch validation failed: lgaValue must occur exactly once.")
              if re.search(r'<article[^>]+data-kpi-sector="all"', text):
                  raise RuntimeError("Marine index patch validation failed: old all-sectors LGA KPI card remains.")
          
          
          def main() -> int:
              if not REFRESH.exists() or not INDEX.exists():
                  missing = [path.name for path in (REFRESH, INDEX) if not path.exists()]
                  raise SystemExit(f"Missing required dashboard file(s): {', '.join(missing)}")
          
              refresh_original = REFRESH.read_text(encoding="utf-8")
              index_original = INDEX.read_text(encoding="utf-8")
          
              try:
                  refresh_patched, refresh_changed = patch_refresh(refresh_original)
                  index_patched, index_changed = patch_index(index_original)
              except Exception as exc:
                  raise SystemExit(f"Marine KPI patch aborted without writing files: {exc}") from exc
          
              # Write only after both files validate, so a failed index patch cannot leave
              # refresh.py half-updated (and vice versa).
              if refresh_changed:
                  REFRESH.write_text(refresh_patched, encoding="utf-8")
              if index_changed:
                  INDEX.write_text(index_patched, encoding="utf-8")
          
              if refresh_changed or index_changed:
                  print("Applied Marine Warnings KPI: MSQ source, Marine sector, and Operational Focus LGA badge.")
              else:
                  print("Marine Warnings KPI is already applied; no changes required.")
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          python /tmp/apply_marine_kpi.py
          python -m py_compile refresh.py

      - name: Refresh live feeds
        run: python refresh.py


      - name: Enable multi-select LGA filter
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_multi_lga.py <<'PY'
          from __future__ import annotations
          
          from pathlib import Path
          import re
          
          INDEX = Path("index.html")
          MARKER = "Multi-LGA filter v4"
          
          CSS_ANCHOR = """    .field input,.field select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:9px;background:#091620;color:var(--text);padding:9px 10px}
          """
          
          CSS_BLOCK = r"""    /* Multi-LGA filter v4 */
              .lga-multi{position:relative;margin-top:5px}
              .lga-multi-trigger{
                width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
                border:1px solid var(--line);border-radius:9px;background:#091620;color:var(--text);
                padding:9px 10px;cursor:pointer;text-align:left;font-weight:700
              }
              .lga-multi-trigger:hover{border-color:var(--line-strong);background:#0d1d29}
              .lga-multi-trigger-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
              .lga-multi-chevron{flex:0 0 auto;color:var(--muted);font-size:15px;line-height:1;transition:transform .15s ease}
              .lga-multi-trigger[aria-expanded="true"] .lga-multi-chevron{transform:rotate(180deg)}
              .lga-multi-menu{
                position:absolute;z-index:1600;left:0;right:0;top:calc(100% + 6px);
                max-height:min(360px,52vh);overflow:auto;padding:6px;border:1px solid var(--line-strong);
                border-radius:10px;background:#091620;box-shadow:0 18px 40px rgba(0,0,0,.38);
                scrollbar-color:#385366 transparent
              }
              .lga-multi-menu[hidden]{display:none}
              .lga-clear{
                width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
                border:0;border-radius:7px;background:transparent;color:var(--text);
                padding:8px 9px;cursor:pointer;text-align:left;font-size:11px;font-weight:800
              }
              .lga-clear:hover,.lga-clear.active{background:#102534}
              .lga-clear small{color:var(--quiet);font-weight:650}
              .lga-option{
                display:flex;align-items:center;gap:9px;border-radius:7px;color:var(--text);
                padding:7px 9px;cursor:pointer;font-size:11px;font-weight:700
              }
              .lga-option:hover{background:#102534}
              .lga-option input{
                appearance:auto;width:15px;height:15px;min-width:15px;margin:0;padding:0;
                border:0;border-radius:3px;accent-color:#4db8e8;cursor:pointer
              }
              .lga-option span{min-width:0}
              html[data-theme="light"] .lga-multi-trigger,
              html[data-theme="light"] .lga-multi-menu{background:#f8fbfd}
              html[data-theme="light"] .lga-multi-trigger:hover,
              html[data-theme="light"] .lga-clear:hover,
              html[data-theme="light"] .lga-clear.active,
              html[data-theme="light"] .lga-option:hover{background:#e9f2f6}
          """
          
          OLD_HTML = """            <label class="field">LGA
                        <select id="lgaFilter"><option value="">All Queensland</option></select>
                      </label>"""
          
          NEW_HTML = """            <div class="field">LGA
                        <div class="lga-multi" id="lgaFilterWrap">
                          <button class="lga-multi-trigger" type="button" id="lgaFilterButton"
                                  aria-haspopup="listbox" aria-expanded="false" aria-controls="lgaFilterMenu">
                            <span class="lga-multi-trigger-text" id="lgaFilterText">All Queensland</span>
                            <span class="lga-multi-chevron" aria-hidden="true">⌄</span>
                          </button>
                          <div class="lga-multi-menu" id="lgaFilterMenu" role="listbox"
                               aria-label="Select one or more LGAs" aria-multiselectable="true" hidden>
                            <button class="lga-clear active" type="button" id="lgaClear">
                              <span>All Queensland</span><small>Clear selections</small>
                            </button>
                            <div id="lgaOptions"></div>
                          </div>
                        </div>
                      </div>"""
          
          OLD_STATE = """    const state = {
                sectors:new Set(Object.keys(SECTORS)),
                lga:'',
                search:'',
                selectedId:null
              };"""
          
          NEW_STATE = """    const state = {
                sectors:new Set(Object.keys(SECTORS)),
                lgas:new Set(),
                search:'',
                selectedId:null
              };"""
          
          OLD_MATCHER = """    function incidentMatchesLga(incident,lga){
                return !lga || incidentLgaNames(incident).includes(lga);
              }"""
          
          NEW_MATCHER = r"""    function incidentMatchesLgas(incident,lgas){
                if(!lgas || !lgas.size) return true;
                const names = incidentLgaNames(incident);
                return [...lgas].some(lga => names.includes(lga));
              }
          
              function lgaSelectionLabel(){
                const selected = [...state.lgas].sort((a,b) => a.localeCompare(b));
                if(!selected.length) return 'All Queensland';
                if(selected.length === 1) return selected[0];
                return `${selected.length} LGAs selected`;
              }
          
              function syncLgaControls(){
                const text = document.getElementById('lgaFilterText');
                const button = document.getElementById('lgaFilterButton');
                const clear = document.getElementById('lgaClear');
                if(text) text.textContent = lgaSelectionLabel();
                if(button){
                  button.title = state.lgas.size
                    ? [...state.lgas].sort((a,b) => a.localeCompare(b)).join(', ')
                    : 'All Queensland';
                }
                if(clear) clear.classList.toggle('active', state.lgas.size === 0);
                document.querySelectorAll('#lgaOptions input[type="checkbox"]').forEach(input => {
                  input.checked = state.lgas.has(input.value);
                });
              }
          
              function fitSelectedLgas(){
                if(!lgaLayer) return;
                if(!state.lgas.size){
                  map.fitBounds(lgaLayer.getBounds(),{padding:[10,10]});
                  return;
                }
                const bounds = L.latLngBounds([]);
                lgaLayer.eachLayer(layer => {
                  const name = layer.feature?.properties?.display_name;
                  if(name && state.lgas.has(name)) bounds.extend(layer.getBounds());
                });
                if(bounds.isValid()) map.fitBounds(bounds,{padding:[28,28]});
              }"""
          
          OLD_MAP_CLICK = """          layer.on('click',() => {
                      state.lga = feature.properties.display_name;
                      document.getElementById('lgaFilter').value = state.lga;
                      map.fitBounds(layer.getBounds(),{padding:[24,24]});
                      render();
                    });"""
          
          NEW_MAP_CLICK = """          layer.on('click',() => {
                      const name = feature.properties.display_name;
                      if(state.lgas.has(name)) state.lgas.delete(name);
                      else state.lgas.add(name);
                      syncLgaControls();
                      fitSelectedLgas();
                      render();
                    });"""
          
          NEW_OPTIONS_BLOCK = r"""    const lgaOptions = document.getElementById('lgaOptions');
              OFFICIAL_LGA_NAMES.forEach(name => {
                const option = document.createElement('label');
                option.className = 'lga-option';
          
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = name;
                checkbox.setAttribute('aria-label', name);
                checkbox.addEventListener('change',event => {
                  if(event.target.checked) state.lgas.add(name);
                  else state.lgas.delete(name);
                  syncLgaControls();
                  fitSelectedLgas();
                  render();
                });
          
                const text = document.createElement('span');
                text.textContent = name;
                option.append(checkbox,text);
                lgaOptions.appendChild(option);
              });
          
              const lgaButton = document.getElementById('lgaFilterButton');
              const lgaMenu = document.getElementById('lgaFilterMenu');
              const lgaWrap = document.getElementById('lgaFilterWrap');
          
              function setLgaMenuOpen(open){
                lgaMenu.hidden = !open;
                lgaButton.setAttribute('aria-expanded', String(open));
              }
          
              lgaButton.addEventListener('click',event => {
                event.stopPropagation();
                setLgaMenuOpen(lgaMenu.hidden);
              });
          
              document.getElementById('lgaClear').addEventListener('click',event => {
                event.stopPropagation();
                state.lgas.clear();
                syncLgaControls();
                fitSelectedLgas();
                render();
              });
          
              document.addEventListener('click',event => {
                if(!lgaWrap.contains(event.target)) setLgaMenuOpen(false);
              });
              document.addEventListener('keydown',event => {
                if(event.key === 'Escape') setLgaMenuOpen(false);
              });
          
              syncLgaControls();
          
          """
          
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Multi-LGA patch expected exactly one {label}; found {count}. "
                      "index.html may have changed."
                  )
              return text.replace(old, new, 1)
          
          
          def apply(text: str) -> tuple[str, bool]:
              if MARKER in text:
                  validate(text)
                  return text, False
          
              text = replace_once(
                  text,
                  CSS_ANCHOR,
                  CSS_ANCHOR + "\n" + CSS_BLOCK,
                  "LGA field CSS anchor",
              )
              text = replace_once(text, OLD_HTML, NEW_HTML, "single-select LGA HTML")
              text = replace_once(text, OLD_STATE, NEW_STATE, "single-LGA state")
              text = replace_once(text, OLD_MATCHER, NEW_MATCHER, "single-LGA matcher")
          
              text = replace_once(
                  text,
                  "incidentMatchesLga(incident,state.lga)",
                  "incidentMatchesLgas(incident,state.lgas)",
                  "context LGA filter",
              )
              text = replace_once(
                  text,
                  "const selected = state.lga === name;",
                  "const selected = state.lgas.has(name);",
                  "selected LGA map style",
              )
              text = replace_once(text, OLD_MAP_CLICK, NEW_MAP_CLICK, "LGA map click handler")
              text = replace_once(
                  text,
                  "const locationScope = state.lga ? ` · ${state.lga}` : '';",
                  "const locationScope = state.lgas.size ? ` · ${lgaSelectionLabel()}` : '';",
                  "incident scope label",
              )
              text = replace_once(
                  text,
                  "const locationText = state.lga || 'Queensland';",
                  "const locationText = state.lgas.size ? lgaSelectionLabel() : 'Queensland';",
                  "map scope label",
              )
          
              options_pattern = re.compile(
                  r"    OFFICIAL_LGA_NAMES\.forEach\(name => \{.*?"
                  r"(?=    document\.getElementById\('search'\)\.addEventListener)",
                  re.S,
              )
              text, count = options_pattern.subn(NEW_OPTIONS_BLOCK, text, count=1)
              if count != 1:
                  raise SystemExit(
                      f"Multi-LGA patch expected one LGA options/change-listener block; found {count}."
                  )
          
              text = replace_once(
                  text,
                  "      state.lga = '';",
                  "      state.lgas.clear();",
                  "reset LGA state",
              )
              text = replace_once(
                  text,
                  "      document.getElementById('lgaFilter').value = '';",
                  "      syncLgaControls();",
                  "reset LGA control",
              )
          
              validate(text)
              return text, True
          
          
          def validate(text: str) -> None:
              required = (
                  MARKER,
                  'id="lgaFilterButton"',
                  'id="lgaFilterMenu"',
                  'id="lgaOptions"',
                  "lgas:new Set()",
                  "incidentMatchesLgas(incident,state.lgas)",
                  "state.lgas.has(name)",
                  "state.lgas.clear();",
                  "syncLgaControls();",
              )
              for token in required:
                  if token not in text:
                      raise SystemExit(f"Multi-LGA patch validation failed: missing {token!r}")
          
              forbidden = (
                  'id="lgaFilter"',
                  "getElementById('lgaFilter')",
                  "incidentMatchesLga(incident,state.lga)",
              )
              for token in forbidden:
                  if token in text:
                      raise SystemExit(
                          f"Multi-LGA patch validation failed: old single-select token remains: {token!r}"
                      )
          
              if re.search(r"\bstate\.lga\b", text):
                  raise SystemExit(
                      "Multi-LGA patch validation failed: an old state.lga reference remains."
                  )
          
          
          def main() -> int:
              if not INDEX.exists():
                  raise SystemExit("index.html was not found.")
          
              original = INDEX.read_text(encoding="utf-8")
              patched, changed = apply(original)
              if changed:
                  INDEX.write_text(patched, encoding="utf-8")
                  print("Enabled multi-select LGA filtering.")
              else:
                  print("Multi-select LGA filtering is already enabled.")
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          python /tmp/apply_multi_lga.py


      - name: Rename dashboard
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rename_dashboard.py <<'PY'
          from pathlib import Path

          path = Path("index.html")
          old = "Queensland Operational Picture"
          new = "Queensland Critical Infrastructure Dashboard"

          text = path.read_text(encoding="utf-8")

          if old in text:
              count = text.count(old)
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print(f"Dashboard renamed to: {new} ({count} occurrence(s) updated).")
          elif new in text:
              print(f"Dashboard title is already: {new}")
          else:
              raise SystemExit(
                  f"Could not find expected dashboard title {old!r} or {new!r} in index.html."
              )
          PY
          python /tmp/rename_dashboard.py

      - name: Save latest snapshot in the repository
        shell: bash
        run: |
          set -euo pipefail

          GOOD_REFRESH_COMMIT="a30369b2f3308aaad9fb448744a9f6aa0411e38f"

          repair_refresh() {
            if [[ ! -f refresh.py ]] || \
               grep -q 'Apply the Critical Infrastructure Dashboard QLDTraffic KPI fix' refresh.py || \
               ! grep -q 'Refresh the data embedded in index.html' refresh.py; then
              git show "${GOOD_REFRESH_COMMIT}:refresh.py" > refresh.py
            fi
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add refresh.py index.html

          if git diff --cached --quiet; then
            echo "No snapshot or parser change to commit."
            exit 0
          fi

          git commit -m "data: refresh dashboard [skip ci]"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} of 3"

            if git push origin HEAD:main; then
              echo "Dashboard snapshot pushed successfully."
              exit 0
            fi

            echo "Remote main changed. Rebuilding against latest main."

            git fetch origin main
            git reset --hard origin/main

            repair_refresh
            python /tmp/apply_qldtraffic_filter.py
            python /tmp/apply_marine_kpi.py
            python -m py_compile refresh.py
            python refresh.py
            python /tmp/apply_multi_lga.py
            python /tmp/rename_dashboard.py
            git add refresh.py index.html

            if git diff --cached --quiet; then
              echo "Latest main already contains equivalent dashboard data."
              exit 0
            fi

            git commit -m "data: refresh dashboard [skip ci]"
            sleep $((attempt * 2))
          done

          echo "Unable to push refreshed dashboard after three attempts."
          exit 1

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
