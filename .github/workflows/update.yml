name: Refresh and deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - refresh.py
      - .github/workflows/update.yml
  schedule:
    # Every 15 minutes, offset from the busiest start-of-hour period.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qld-dashboard
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Refresh live feeds
        run: python refresh.py

      - name: Save latest snapshot in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No snapshot change to commit."
          else
            git commit -m "data: refresh dashboard"
            git push
          fi

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
