      - name: Apply Marine Warnings KPI
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_marine_kpi.py <<'PY'
          #!/usr/bin/env python3
          """Add the MSQ Marine Warnings KPI to the Critical Infrastructure Dashboard.
          
          This is an idempotent repository patcher. It updates both refresh.py and
          index.html while deliberately leaving the existing QLDTraffic, Queensland-only,
          multi-LGA and dashboard-title patches untouched.
          
          Marine data is fetched from the public Maritime Safety Queensland dashboard.
          Because that site is a JavaScript application, the parser is intentionally
          fail-closed: a zero is accepted only when the returned document explicitly says
          there are no current maritime/marine warnings. If the public page exposes only
          its application shell, refresh.py raises an error so the dashboard displays the
          source as unavailable (or keeps a previously verified fallback) instead of
          showing a false zero.
          """
          from __future__ import annotations
          
          from pathlib import Path
          import re
          
          ROOT = Path.cwd()
          REFRESH = ROOT / "refresh.py"
          INDEX = ROOT / "index.html"
          
          REFRESH_MARKER = "# Marine Warnings KPI: Maritime Safety Queensland v1"
          INDEX_MARKER = "/* Marine Warnings KPI v1 */"
          MSQ_URL = "https://qldmaritime.msq.qld.gov.au/"
          
          
          MARINE_PARSER_BLOCK = r'''
          # Marine Warnings KPI: Maritime Safety Queensland v1
          MSQ_NO_WARNING_PHRASES = (
              "no current maritime warnings",
              "no active maritime warnings",
              "there are no current maritime warnings",
              "there are no active maritime warnings",
              "no current marine warnings",
              "no active marine warnings",
              "there are no current marine warnings",
              "there are no active marine warnings",
          )
          
          MSQ_GENERIC_WARNING_LABELS = {
              "marine warning",
              "marine warnings",
              "maritime warning",
              "maritime warnings",
              "warnings",
              "current warnings",
              "maritime safety queensland",
              "opt in notifications",
          }
          
          
          class _MSQVisibleTextParser(HTMLParser):
              """Extract visible text lines without executing dashboard JavaScript."""
          
              _BREAK_TAGS = {
                  "address", "article", "aside", "br", "dd", "div", "dl", "dt",
                  "figcaption", "footer", "h1", "h2", "h3", "h4", "h5", "h6",
                  "header", "li", "main", "nav", "p", "section", "table", "td",
                  "th", "tr", "ul",
              }
          
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.parts: list[str] = []
                  self._skip_depth = 0
          
              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  tag = tag.lower()
                  if tag in {"script", "style"}:
                      self._skip_depth += 1
                      return
                  if not self._skip_depth and tag in self._BREAK_TAGS:
                      self.parts.append("\n")
          
              def handle_endtag(self, tag: str) -> None:
                  tag = tag.lower()
                  if tag in {"script", "style"}:
                      self._skip_depth = max(0, self._skip_depth - 1)
                      return
                  if not self._skip_depth and tag in self._BREAK_TAGS:
                      self.parts.append("\n")
          
              def handle_data(self, data: str) -> None:
                  if not self._skip_depth:
                      self.parts.append(data)
          
              def lines(self) -> list[str]:
                  return [clean(line) for line in "".join(self.parts).splitlines() if clean(line)]
          
          
          def _msq_warning_candidate(value: Any) -> str | None:
              text = clean(html.unescape(str(value or "")))
              if len(text) < 12 or len(text) > 500:
                  return None
          
              key = norm(text)
              if not key or key in MSQ_GENERIC_WARNING_LABELS:
                  return None
              if key.startswith("opt in notification") or key in {"sign in", "register"}:
                  return None
          
              # Strong phrases that identify an operational maritime warning rather than
              # a navigation label or general preparedness link on the dashboard shell.
              strong_phrases = (
                  "port closed",
                  "port closure",
                  "pilotage area closed",
                  "waterway closed",
                  "closed to vessel traffic",
                  "closed to all vessel traffic",
                  "navigation warning",
                  "hazard to navigation",
                  "marine warning in place",
                  "marine warnings in place",
                  "maritime warning in place",
                  "maritime warnings in place",
                  "extreme weather warning",
                  "red alert",
                  "orange alert",
                  "yellow alert",
                  "white alert",
              )
              if any(phrase in key for phrase in strong_phrases):
                  return text
          
              # Also accept a descriptive warning sentence when it contains both a
              # maritime subject and an active/impact qualifier.
              maritime_terms = (
                  "port", "pilotage", "waterway", "navigation", "harbour", "harbor",
                  "vessel", "marine", "maritime", "cyclone", "storm", "swell", "flood",
              )
              active_terms = (
                  "active", "current", "closed", "closure", "hazard", "danger",
                  "alert", "issued", "effective", "restricted", "restriction",
              )
              if "warning" in key and any(term in key for term in maritime_terms) and any(term in key for term in active_terms):
                  return text
          
              return None
          
          
          def _msq_unique_candidates(values: list[str]) -> list[str]:
              candidates = []
              for value in values:
                  candidate = _msq_warning_candidate(value)
                  if candidate:
                      candidates.append(candidate)
          
              # Prefer concise card/title text when a longer captured block contains the
              # same warning. This avoids counting one dashboard card multiple times.
              unique: list[tuple[str, str]] = []
              for candidate in sorted(candidates, key=lambda item: (len(item), item.lower())):
                  key = norm(candidate)
                  if any(key == existing or (len(key) >= 24 and (key in existing or existing in key)) for existing, _ in unique):
                      continue
                  unique.append((key, candidate))
          
              if len(unique) > 40:
                  raise RuntimeError(
                      "MSQ dashboard warning extraction was ambiguous (more than 40 candidate blocks); "
                      "refusing to publish a potentially misleading KPI."
                  )
              return [candidate for _, candidate in unique]
          
          
          def parse_msq_marine_warnings(html_data: bytes) -> list[dict[str, Any]]:
              """Parse active warnings from the public MSQ dashboard, failing closed.
          
              A verified explicit no-warning message is the only condition that produces
              a trustworthy zero. If the server returns only the JavaScript application
              shell, raise so source health reports the feed as unavailable rather than 0.
              """
              raw = html_data.decode("utf-8-sig", errors="replace")
              if not clean(raw):
                  raise RuntimeError("MSQ dashboard returned an empty response")
          
              parser = _MSQVisibleTextParser()
              parser.feed(raw)
              visible_lines = parser.lines()
              visible_key = norm(" ".join(visible_lines))
          
              if any(phrase in visible_key for phrase in MSQ_NO_WARNING_PHRASES):
                  return []
          
              # Some Guardian/QIT dashboard deployments place public card payloads in
              # script/JSON strings even when the main page is client-rendered. Inspect
              # string values as a secondary path, without executing any JavaScript.
              script_strings = []
              for match in re.finditer(r"[\"']([^\"'\r\n]{12,500})[\"']", raw):
                  value = match.group(1)
                  if "warning" in value.lower() or "alert" in value.lower() or "closed" in value.lower():
                      script_strings.append(value.replace(r"\u0026", "&").replace(r"\/", "/"))
          
              warnings = _msq_unique_candidates(visible_lines + script_strings)
              if not warnings:
                  shell_key = norm(raw)
                  if "maritime safety queensland" in shell_key or "powered by qit plus" in shell_key:
                      raise RuntimeError(
                          "MSQ dashboard returned its application shell, but the active maritime-warning state "
                          "was not present in the server response"
                      )
                  raise RuntimeError("Unable to verify the active maritime-warning state from the MSQ dashboard")
          
              incidents = []
              for warning in warnings:
                  title = warning if len(warning) <= 170 else warning[:167].rstrip() + "…"
                  description = "" if title == warning else warning
                  incidents.append({
                      "id": f"marine-{stable_id(warning)}",
                      "sector": "marine",
                      "subtype": "warning",
                      "event_category": "maritime warning",
                      "title": title,
                      "description": description,
                      "status": "Active maritime warning",
                      "lga": None,
                      "locality": "Queensland maritime network",
                      "coordinates": None,
                      "geometry": None,
                      "customers": 0,
                      "planned": False,
                      "updated": NOW_ISO,
                      "source_name": "Maritime Safety Queensland",
                      "source_url": SOURCES["marine"]["url"],
                  })
              return incidents
          
          
          '''
          
          
          INDEX_CSS_BLOCK = r'''    /* Marine Warnings KPI v1 */
              .focus-lga-kpi{
                flex:0 0 auto;display:flex;align-items:center;gap:9px;min-width:112px;
                padding:7px 9px;border:1px solid rgba(165,140,242,.42);border-radius:10px;
                background:rgba(165,140,242,.12);box-shadow:inset 3px 0 0 #a58cf2
              }
              .focus-lga-kpi-label{color:#cbbdfb;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.15}
              .focus-lga-kpi-value{color:#cbbdfb;font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
              html[data-theme="light"] .focus-lga-kpi{background:rgba(112,83,205,.08);border-color:rgba(112,83,205,.3)}
              html[data-theme="light"] .focus-lga-kpi-label,html[data-theme="light"] .focus-lga-kpi-value{color:#6749b8}
          '''
          
          MARINE_CARD = '''        <article class="metric" style="--tone:var(--marine)" data-kpi-sector="marine" role="button" tabindex="0" aria-label="Toggle marine warnings">
                    <div class="metric-label">Marine warnings</div>
                    <div class="metric-value" id="marineValue">—</div>
                    <div class="metric-detail" id="marineDetail">MSQ status pending</div>
                  </article>
          '''
          
          LGA_BADGE = '''          <div class="focus-lga-kpi" title="Queensland LGAs affected within the current filters" aria-label="LGAs affected within current filters">
                      <span class="focus-lga-kpi-label">LGAs<br>affected</span>
                      <strong class="focus-lga-kpi-value" id="lgaValue">0</strong>
                    </div>
          '''
          
          
          METRIC_ARTICLE_PATTERN = re.compile(
              r'''(?ms)^[ \t]*<article\b[^>]*>.*?</article>[ \t]*(?:\n|$)'''
          )


          def replace_top_lga_card(text: str) -> str:
              """Replace the existing top-row LGA KPI without depending on its styling.

              Earlier workflow versions changed the card's tone, attributes and initial
              value, so matching the full HTML block made this patch unnecessarily
              brittle. The stable identifiers are the lgaValue element and its visible
              "LGAs affected" label.
              """
              matches = []
              for match in METRIC_ARTICLE_PATTERN.finditer(text):
                  block = match.group(0)
                  has_value = re.search(r'''\bid=["']lgaValue["']''', block, re.I)
                  has_label = re.search(r'''>\s*LGAs\s+affected\s*<''', block, re.I)
                  if has_value and has_label:
                      matches.append(match)

              if len(matches) != 1:
                  raise RuntimeError(
                      "Marine KPI patch expected one top-row LGAs affected card "
                      f"identified by lgaValue; found {len(matches)}."
                  )

              match = matches[0]
              return text[:match.start()] + MARINE_CARD + text[match.end():]
          
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Marine KPI patch expected exactly one {label}; found {count}.")
              return text.replace(old, new, 1)
          
          
          def patch_refresh(text: str) -> tuple[str, bool]:
              if REFRESH_MARKER in text:
                  validate_refresh(text)
                  return text, False
          
              if 'from html.parser import HTMLParser' not in text:
                  text = replace_once(
                      text,
                      "import html\n",
                      "import html\nfrom html.parser import HTMLParser\n",
                      "html import anchor",
                  )
          
              if '"marine": {' not in text:
                  geography_anchor = '    "geography": {\n'
                  marine_source = (
                      '    "marine": {\n'
                      '        "name": "Maritime Safety Queensland",\n'
                      f'        "url": "{MSQ_URL}",\n'
                      '    },\n'
                  )
                  text = replace_once(
                      text,
                      geography_anchor,
                      marine_source + geography_anchor,
                      "SOURCES geography anchor",
                  )
          
              text = replace_once(
                  text,
                  "\ndef read_embedded() -> dict[str, Any]:\n",
                  "\n" + MARINE_PARSER_BLOCK + "def read_embedded() -> dict[str, Any]:\n",
                  "read_embedded anchor",
              )
          
              rail_job = '        ("rail", lambda: parse_rail(get_bytes(SOURCES["rail"]["url"]))),\n'
              marine_job = '        ("marine", lambda: parse_msq_marine_warnings(get_bytes(SOURCES["marine"]["url"]))),\n'
              text = replace_once(text, rail_job, rail_job + marine_job, "rail job anchor")
          
              validate_refresh(text)
              return text, True
          
          
          def validate_refresh(text: str) -> None:
              # The base Marine KPI is applied before the location/detail upgrades.
              # On later scheduled runs refresh.py may already contain the upgraded
              # two-argument parser and job call, so validation must accept both
              # the original and upgraded forms.
              required = (
                  REFRESH_MARKER,
                  '"marine": {',
                  '"name": "Maritime Safety Queensland"',
                  f'"url": "{MSQ_URL}"',
                  '"sector": "marine"',
              )
              for token in required:
                  if token not in text:
                      raise RuntimeError(f"Marine refresh patch validation failed: missing {token!r}.")

              parser_forms = (
                  'def parse_msq_marine_warnings(html_data: bytes)',
                  'def parse_msq_marine_warnings(html_data: bytes, lgas: dict[str, Any])',
                  'def parse_msq_marine_warnings(lgas: dict[str, Any])',
              )
              if not any(token in text for token in parser_forms):
                  raise RuntimeError(
                      "Marine refresh patch validation failed: missing a supported "
                      "parse_msq_marine_warnings() signature."
                  )

              job_forms = (
                  '("marine", lambda: parse_msq_marine_warnings(get_bytes(SOURCES["marine"]["url"]))),',
                  '("marine", lambda: parse_msq_marine_warnings(get_bytes(SOURCES["marine"]["url"]), lgas)),',
                  '("marine", lambda: parse_msq_marine_warnings(lgas)),',
              )
              if not any(token in text for token in job_forms):
                  raise RuntimeError(
                      "Marine refresh patch validation failed: missing a supported Marine refresh job call."
                  )

              compile(text, str(REFRESH), "exec")
          
          
          def patch_index(text: str) -> tuple[str, bool]:
              if INDEX_MARKER in text:
                  validate_index(text)
                  return text, False
          
              # Add a distinct marine sector colour while keeping the five-card KPI grid.
              text = replace_once(
                  text,
                  "      --schools-soft:rgba(72,199,142,.13);\n",
                  "      --schools-soft:rgba(72,199,142,.13);\n"
                  "      --marine:#35c6bb;\n"
                  "      --marine-soft:rgba(53,198,187,.14);\n",
                  "schools colour variables",
              )
          
              css_anchor = "    .metric-detail{margin-top:4px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n"
              text = replace_once(text, css_anchor, css_anchor + "\n" + INDEX_CSS_BLOCK, "metric-detail CSS anchor")
          
              text = replace_top_lga_card(text)
          
              focus_anchor = '''            <div class="panel-subtitle">Filter active disruptions by location, sector, or search term</div>
                    </div>
                  </div>
                  <div class="filter-body">
          '''
              focus_replacement = '''            <div class="panel-subtitle">Filter active disruptions by location, sector, or search term</div>
                    </div>
          ''' + LGA_BADGE + '''        </div>
                  <div class="filter-body">
          '''
              text = replace_once(text, focus_anchor, focus_replacement, "Operational focus header")
          
              sectors_anchor = "      schools: {label:'Schools', symbol:'S', colour:'#48c78e', soft:'rgba(72,199,142,.14)'}\n"
              sectors_replacement = (
                  "      schools: {label:'Schools', symbol:'S', colour:'#48c78e', soft:'rgba(72,199,142,.14)'},\n"
                  "      marine: {label:'Marine', symbol:'M', colour:'#35c6bb', soft:'rgba(53,198,187,.14)'}\n"
              )
              text = replace_once(text, sectors_anchor, sectors_replacement, "SECTORS schools entry")
          
              source_anchor = "      schools:'https://closures.qld.edu.au/'\n"
              source_replacement = (
                  "      schools:'https://closures.qld.edu.au/',\n"
                  f"      marine:'{MSQ_URL}'\n"
              )
              text = replace_once(text, source_anchor, source_replacement, "official source schools entry")
          
              summary_anchor = "      const nonStateSchools = schools.filter(i => String(i.school_sector || '').toLowerCase() !== 'state');\n"
              summary_insert = summary_anchor + (
                  "      const marine = context.filter(i => i.sector === 'marine');\n"
                  "      const marineSource = DASHBOARD_DATA.sources?.marine || {};\n"
              )
              text = replace_once(text, summary_anchor, summary_insert, "renderSummary school calculation")
          
              school_dom_anchor = "      document.getElementById('schoolDetail').textContent = `${fmt(stateSchools.length)} state · ${fmt(nonStateSchools.length)} non-state`;\n"
              marine_dom = school_dom_anchor + (
                  "      const marineValue = document.getElementById('marineValue');\n"
                  "      const marineDetail = document.getElementById('marineDetail');\n"
                  "      const marineVerified = marineSource.status === 'current' || marineSource.status === 'fallback';\n"
                  "      marineValue.textContent = marineVerified ? fmt(marine.length) : '—';\n"
                  "      marineDetail.textContent = marineSource.status === 'fallback'\n"
                  "        ? 'cached MSQ snapshot'\n"
                  "        : marineSource.status === 'current'\n"
                  "          ? `${fmt(marine.length)} active warning${marine.length === 1 ? '' : 's'}`\n"
                  "          : 'MSQ unavailable';\n"
              )
              text = replace_once(text, school_dom_anchor, marine_dom, "renderSummary school DOM update")
          
              validate_index(text)
              return text, True
          
          
          def validate_index(text: str) -> None:
              required = (
                  INDEX_MARKER,
                  '--marine:#35c6bb;',
                  'data-kpi-sector="marine"',
                  'id="marineValue"',
                  'id="marineDetail"',
                  'class="focus-lga-kpi"',
                  'id="lgaValue"',
                  "marine: {label:'Marine'",
                  f"marine:'{MSQ_URL}'",
                  "const marineSource = DASHBOARD_DATA.sources?.marine || {};",
                  "'MSQ unavailable'",
              )
              for token in required:
                  if token not in text:
                      raise RuntimeError(f"Marine index patch validation failed: missing {token!r}.")
          
              if text.count('id="marineValue"') != 1:
                  raise RuntimeError("Marine index patch validation failed: marineValue must occur exactly once.")
              if text.count('id="lgaValue"') != 1:
                  raise RuntimeError("Marine index patch validation failed: lgaValue must occur exactly once.")
              if re.search(r'<article[^>]+data-kpi-sector="all"', text):
                  raise RuntimeError("Marine index patch validation failed: old all-sectors LGA KPI card remains.")
          
          
          def main() -> int:
              if not REFRESH.exists() or not INDEX.exists():
                  missing = [path.name for path in (REFRESH, INDEX) if not path.exists()]
                  raise SystemExit(f"Missing required dashboard file(s): {', '.join(missing)}")
          
              refresh_original = REFRESH.read_text(encoding="utf-8")
              index_original = INDEX.read_text(encoding="utf-8")
          
              try:
                  refresh_patched, refresh_changed = patch_refresh(refresh_original)
                  index_patched, index_changed = patch_index(index_original)
              except Exception as exc:
                  raise SystemExit(f"Marine KPI patch aborted without writing files: {exc}") from exc
          
              # Write only after both files validate, so a failed index patch cannot leave
              # refresh.py half-updated (and vice versa).
              if refresh_changed:
                  REFRESH.write_text(refresh_patched, encoding="utf-8")
              if index_changed:
                  INDEX.write_text(index_patched, encoding="utf-8")
          
              if refresh_changed or index_changed:
                  print("Applied Marine Warnings KPI: MSQ source, Marine sector, and Operational Focus LGA badge.")
              else:
                  print("Marine Warnings KPI is already applied; no changes required.")
              return 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          python /tmp/apply_marine_kpi.py
          python -m py_compile refresh.py

      - name: Use exact MSQ imsBulletin source v9
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_msq_verified_source.py <<'PY'
          #!/usr/bin/env python3
          # Consume only records parsed from MSQ Guardian's structured imsBulletin FeatureCollection.
          from __future__ import annotations

          from pathlib import Path
          import re

          path = Path("refresh.py")
          text = path.read_text(encoding="utf-8")
          marker = "# Marine exact imsBulletin source v9"

          verified_block = r'''
          # Marine Warnings KPI: Maritime Safety Queensland v1
          # Marine exact imsBulletin source v9
          # The workflow captures Guardian's /dashboard/imsBulletin FeatureCollection and writes verified current records to /tmp/msq-current-warnings.json.
          MSQ_BROWSER_SNAPSHOT = Path("/tmp/msq-current-warnings.json")

          MSQ_QLD_BOUNDS = {"min_lon": 137.8, "max_lon": 154.2, "min_lat": -29.3, "max_lat": -9.0}
          MSQ_LOCATION_POINTS = (
              (("rockhampton", "fitzroy river"), "Rockhampton / Fitzroy River", [150.510, -23.380]),
              (("port alma",), "Port Alma", [150.860, -23.590]),
              (("gladstone", "port curtis"), "Gladstone", [151.250, -23.840]),
              (("bundaberg", "burnett river"), "Bundaberg / Burnett River", [152.390, -24.760]),
              (("hervey bay",), "Hervey Bay", [152.900, -25.280]),
              (("wide bay", "tin can bay"), "Wide Bay", [152.780, -25.820]),
              (("mooloolah river", "mooloolaba"), "Mooloolaba / Mooloolah River", [153.126, -26.681]),
              (("maroochy river", "maroochydore"), "Maroochy River", [153.089, -26.650]),
              (("noosa",), "Noosa", [153.102, -26.382]),
              (("pumicestone passage", "golden beach", "bribie island"), "Pumicestone Passage", [153.112, -27.005]),
              (("moreton bay", "cape moreton", "moreton island"), "Moreton Bay", [153.250, -27.200]),
              (("port of brisbane", "brisbane pilotage", "brisbane port"), "Port of Brisbane", [153.170, -27.380]),
              (("redland bay", "weinam creek", "weinam"), "Redland Bay", [153.302, -27.612]),
              (("southport", "gold coast seaway", "gold coast"), "Southport / Gold Coast", [153.431, -27.967]),
              (("mackay",), "Mackay", [149.230, -21.120]), (("hay point",), "Hay Point", [149.300, -21.290]),
              (("whitsunday", "airlie beach"), "Whitsundays", [148.720, -20.270]), (("bowen",), "Bowen", [148.250, -20.010]),
              (("abbot point",), "Abbot Point", [148.084, -19.878]), (("townsville",), "Townsville", [146.830, -19.250]),
              (("lucinda", "hinchinbrook"), "Lucinda / Hinchinbrook", [146.330, -18.530]), (("mourilyan",), "Mourilyan", [146.120, -17.600]),
              (("cairns",), "Cairns", [145.780, -16.920]), (("port douglas",), "Port Douglas", [145.460, -16.480]),
              (("daintree river",), "Daintree River", [145.460, -16.290]), (("cooktown",), "Cooktown", [145.250, -15.460]),
              (("cape flattery",), "Cape Flattery", [145.310, -14.960]), (("weipa",), "Weipa", [141.870, -12.680]),
              (("amrun",), "Amrun", [141.650, -12.900]), (("skardon river",), "Skardon River", [142.050, -11.790]),
              (("thursday island", "torres strait"), "Thursday Island / Torres Strait", [142.220, -10.580]),
              (("karumba",), "Karumba", [140.830, -17.490]), (("gulf of carpentaria",), "Gulf of Carpentaria", [140.900, -16.500]),
          )

          def _msq_point_in_qld(point: list[float] | None) -> bool:
              if not point or len(point) < 2: return False
              try: lon, lat = float(point[0]), float(point[1])
              except (TypeError, ValueError): return False
              return MSQ_QLD_BOUNDS["min_lon"] <= lon <= MSQ_QLD_BOUNDS["max_lon"] and MSQ_QLD_BOUNDS["min_lat"] <= lat <= MSQ_QLD_BOUNDS["max_lat"]

          def _msq_location_from_lga(value: str, lgas: dict[str, Any]) -> tuple[list[float] | None, str | None]:
              warning_key = norm(value); best: tuple[int, list[float], str] | None = None
              for feature in lgas.get("features", []):
                  props = feature.get("properties") or {}; names: list[str] = []
                  for prop_key, prop_value in props.items():
                      field = str(prop_key).lower()
                      if prop_value and ("lga" in field or "name" in field or "local_government" in field):
                          name = clean(prop_value)
                          if name: names.append(name)
                  for name in names:
                      name_key = norm(name)
                      if len(name_key) < 4 or name_key not in warning_key: continue
                      point = representative_point(feature.get("geometry"))
                      if point and _msq_point_in_qld(point):
                          score = len(name_key)
                          if best is None or score > best[0]: best = (score, point, name)
              if best: return [round(float(best[1][0]), 6), round(float(best[1][1]), 6)], best[2]
              return None, None

          def _msq_warning_location(value: str, lgas: dict[str, Any]) -> tuple[list[float] | None, str, str | None, str]:
              warning_key = norm(value)
              for aliases, locality, point in MSQ_LOCATION_POINTS:
                  if any(norm(alias) in warning_key for alias in aliases):
                      lga = locate_lga(point, lgas) if lgas.get("features") else None
                      return list(point), locality, lga, "representative"
              point, lga = _msq_location_from_lga(value, lgas)
              if point: return point, lga or clean(value), lga, "lga"
              return None, clean(value) or "Area identified by MSQ", None, "unmapped"

          def _msq_snapshot() -> dict[str, Any]:
              if not MSQ_BROWSER_SNAPSHOT.exists(): raise RuntimeError("verified MSQ browser snapshot was not created by the workflow")
              try: payload = json.loads(MSQ_BROWSER_SNAPSHOT.read_text(encoding="utf-8"))
              except Exception as exc: raise RuntimeError(f"verified MSQ browser snapshot is unreadable: {exc}") from exc
              if payload.get("schema") != "msq-browser-current-v2": raise RuntimeError("verified MSQ browser snapshot has an unexpected schema")
              if payload.get("status") != "current": raise RuntimeError(clean(payload.get("error")) or "MSQ browser source could not be verified")
              warnings = payload.get("warnings")
              if not isinstance(warnings, list): raise RuntimeError("verified MSQ browser snapshot does not contain a warning list")
              if not warnings and not bool(payload.get("verified_zero")): raise RuntimeError("MSQ snapshot contains zero records without an explicit verified no-warning state")
              return payload

          def parse_msq_marine_warnings(lgas: dict[str, Any]) -> list[dict[str, Any]]:
              payload = _msq_snapshot(); incidents: list[dict[str, Any]] = []
              for item in payload.get("warnings", []):
                  if not isinstance(item, dict): continue
                  title = clean(item.get("title")); area = clean(item.get("area")); description = clean(item.get("description"))
                  if not title or not area: raise RuntimeError("verified MSQ warning is missing its rendered title or area")
                  method = clean(item.get("source_method"))
                  if method not in {"msq-imsBulletin-feature", "rendered-visible-card", "rendered-visible-text-window", "structured-browser-network"}:
                      raise RuntimeError("MSQ warning was not sourced from the verified imsBulletin/browser evidence path")
                  source_point = item.get("coordinates")
                  if _msq_point_in_qld(source_point):
                      coordinates = [round(float(source_point[0]), 6), round(float(source_point[1]), 6)]
                      locality = area
                      lga = locate_lga(coordinates, lgas) if lgas.get("features") else None
                      location_precision = clean(item.get("location_precision")) or "source-area-centroid"
                  else:
                      coordinates, locality, lga, location_precision = _msq_warning_location(" ".join(filter(None, (area, title, description))), lgas)
                  incident_id = clean(item.get("feature_id")) or stable_id(area, title)
                  incidents.append({
                      "id": f"marine-{incident_id}", "sector": "marine", "subtype": "warning", "event_category": "maritime warning",
                      "title": title[:220], "description": description[:3500], "status": clean(item.get("status")) or "Active maritime warning",
                      "marine_alert_phase": clean(item.get("alert_phase")) or None, "marine_warning_level": clean(item.get("warning_level")) or None,
                      "marine_action": clean(item.get("action")) or None, "marine_issued_text": clean(item.get("issued_text")) or None,
                      "lga": lga, "locality": locality, "coordinates": coordinates, "geometry": None, "location_precision": location_precision,
                      "customers": 0, "planned": False,
                      "updated": clean(item.get("updated_iso")) or clean(payload.get("published")) or clean(payload.get("captured_at")) or NOW_ISO,
                      "source_name": "Maritime Safety Queensland", "source_url": clean(item.get("source_url")) or SOURCES["marine"]["url"],
                      "source_method": "msq-imsBulletin-current-warning", "marine_feature_id": clean(item.get("feature_id")) or None,
                  })
              return incidents
          '''

          block_pattern = re.compile(r"(?ms)^# Marine Warnings KPI: Maritime Safety Queensland v1\n.*?(?=^def read_embedded\()")
          if marker not in text:
              text, count = block_pattern.subn(lambda _m: verified_block + "\n\n", text, count=1)
              if count != 1: raise SystemExit(f"Verified MSQ source patch expected one legacy Marine parser block; found {count}.")

          new_job = '("marine", lambda: parse_msq_marine_warnings(lgas)),'
          job_pattern = re.compile(r'(?m)^(?P<indent>[ \t]*)\("marine", lambda: parse_msq_marine_warnings\([^\n]*\)\),[ \t]*$')
          matches = list(job_pattern.finditer(text))
          if len(matches) == 1 and new_job not in matches[0].group(0):
              match = matches[0]; text = text[:match.start()] + match.group("indent") + new_job + text[match.end():]
          elif len(matches) != 1 and new_job not in text:
              raise SystemExit(f"Verified MSQ source patch expected one Marine refresh job; found {len(matches)}.")

          fallback_pattern = re.compile(r'(?ms)^(?P<indent>[ \t]+)fallback = \(\n(?P<body>.*?qldtraffic_fallback_records\(previous_by_source\.get\(key, \[\]\), lgas\).*?)^(?P=indent)\)[ \t]*$')
          fallback_match = fallback_pattern.search(text)
          if fallback_match:
              indent = fallback_match.group("indent")
              fallback_new = (f"{indent}fallback = (\n" f"{indent}    qldtraffic_fallback_records(previous_by_source.get(key, []), lgas)\n"
                              f'{indent}    if key == "qldtraffic"\n' f"{indent}    else []\n" f'{indent}    if key == "marine"\n'
                              f"{indent}    else previous_by_source.get(key, [])\n" f"{indent})")
              text = text[:fallback_match.start()] + fallback_new + text[fallback_match.end():]

          required = (marker, 'MSQ_BROWSER_SNAPSHOT = Path("/tmp/msq-current-warnings.json")', "def parse_msq_marine_warnings(lgas: dict[str, Any])",
                      '"source_method": "msq-imsBulletin-current-warning"', new_job, 'if key == "marine"')
          for token in required:
              if token not in text: raise SystemExit(f"Verified MSQ source validation failed: missing {token!r}.")
          forbidden = ("script_strings = []", "_msq_unique_candidates(", "MSQ_STATEWIDE_POINT", "msq_marine_fallback_records(",
                       'parse_msq_marine_warnings(get_bytes(SOURCES["marine"]["url"])')
          for token in forbidden:
              if token in text: raise SystemExit(f"Verified MSQ source validation failed: legacy Marine scraper token remains: {token!r}.")
          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          print("MSQ imsBulletin source v9 applied: structured FeatureCollection records only; stale/guessed Marine fallback disabled.")
          PY

          python /tmp/apply_msq_verified_source.py
          python -m py_compile refresh.py

      - name: Add Marine KPI trend
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_marine_trend.py <<'PY'
          #!/usr/bin/env python3
          """Install/upgrade KPI history and add the Marine warnings trend.

          The live refresher restored by this workflow predates the KPI-history helpers,
          so this patch installs the history mechanism when it is absent instead of
          assuming calculate_kpi_snapshot() already exists.
          """
          from __future__ import annotations

          from pathlib import Path
          import re

          REFRESH = Path("refresh.py")
          INDEX = Path("index.html")
          REFRESH_MARKER = "# KPI trend history v2 (includes Marine)"
          INDEX_MARKER = "<!-- Marine KPI trend v2 -->"

          HISTORY_BLOCK = r'''
          # KPI trend history v2 (includes Marine)
          HISTORY_RETENTION = timedelta(days=7)
          HISTORY_MIN_SPACING = timedelta(minutes=10)
          HISTORY_MAX_POINTS = 700


          def _kpi_history_incident_lgas(incident: dict[str, Any], official_names: set[str]) -> set[str]:
              """Return official Queensland LGA labels represented by one incident."""
              aliases = {"Moreton Bay Regional": "City of Moreton Bay"}
              names: set[str] = set()
              raw = clean(incident.get("lga"))
              if not raw:
                  return names
              for part in re.split(r"\s*/\s*|\s*;\s*", raw):
                  name = aliases.get(clean(part), clean(part))
                  if name and (not official_names or name in official_names):
                      names.add(name)
              return names


          def calculate_kpi_snapshot(incidents: list[dict[str, Any]], lgas: dict[str, Any], at: str) -> dict[str, Any]:
              """Create compact statewide values used by the KPI trend visuals."""
              roads = [item for item in incidents if item.get("sector") == "roads"]
              power = [item for item in incidents if item.get("sector") == "power"]
              rail = [item for item in incidents if item.get("sector") == "rail"]
              schools = [item for item in incidents if item.get("sector") == "schools"]
              marine = [item for item in incidents if item.get("sector") == "marine"]
              official_names = {
                  clean(feature.get("properties", {}).get("display_name"))
                  for feature in lgas.get("features", [])
                  if clean(feature.get("properties", {}).get("display_name"))
              }
              affected_lgas: set[str] = set()
              for incident in incidents:
                  affected_lgas.update(_kpi_history_incident_lgas(incident, official_names))
              return {
                  "at": at,
                  "roads": len(roads),
                  "power_customers": sum(int(item.get("customers") or 0) for item in power),
                  "power_outages": len(power),
                  "rail": len(rail),
                  "schools": len(schools),
                  "marine": len(marine),
                  "lgas": len(affected_lgas),
              }


          def update_kpi_history(previous: dict[str, Any], incidents: list[dict[str, Any]], lgas: dict[str, Any]) -> list[dict[str, Any]]:
              """Preserve, append and prune KPI history across scheduled refreshes."""
              history = [
                  item for item in previous.get("history", [])
                  if isinstance(item, dict) and item.get("at")
              ]
              if not history and previous.get("generated_at"):
                  history.append(
                      calculate_kpi_snapshot(
                          previous.get("incidents", []),
                          lgas,
                          clean(previous.get("generated_at")),
                      )
                  )

              current = calculate_kpi_snapshot(incidents, lgas, NOW_ISO)
              last_at = parse_date(history[-1].get("at")) if history else None
              if last_at and NOW - last_at < HISTORY_MIN_SPACING:
                  history[-1] = current
              else:
                  history.append(current)

              cutoff = NOW - HISTORY_RETENTION
              retained: list[dict[str, Any]] = []
              for item in history:
                  item_at = parse_date(item.get("at"))
                  if item_at and item_at >= cutoff:
                      retained.append(item)
              return retained[-HISTORY_MAX_POINTS:]
          '''


          def patch_existing_snapshot_function(text: str) -> tuple[str, bool]:
              pattern = re.compile(
                  r"(?ms)^def calculate_kpi_snapshot\([^\n]*\).*?(?=^def [A-Za-z_][A-Za-z0-9_]*\(|\Z)"
              )
              match = pattern.search(text)
              if not match:
                  return text, False
              block = match.group(0)
              changed = False

              marine_list = '    marine = [item for item in incidents if item.get("sector") == "marine"]\n'
              if marine_list not in block:
                  anchor = '    schools = [item for item in incidents if item.get("sector") == "schools"]\n'
                  if anchor not in block:
                      raise RuntimeError("Existing KPI snapshot function has an unrecognised sector-list layout.")
                  block = block.replace(anchor, anchor + marine_list, 1)
                  changed = True

              if '"marine": len(marine),' not in block:
                  anchor_re = re.compile(r'(?m)^(?P<indent>\s*)"schools"\s*:\s*len\(schools\),\s*$')
                  anchor_match = anchor_re.search(block)
                  if not anchor_match:
                      raise RuntimeError("Existing KPI snapshot function has no schools return field anchor.")
                  insert_at = anchor_match.end()
                  indent = anchor_match.group("indent")
                  block = block[:insert_at] + f'\n{indent}"marine": len(marine),' + block[insert_at:]
                  changed = True

              return text[:match.start()] + block + text[match.end():], changed


          def patch_refresh(text: str) -> tuple[str, bool]:
              changed = False
              has_snapshot = "def calculate_kpi_snapshot(" in text
              has_update = "def update_kpi_history(" in text

              if not has_snapshot and not has_update:
                  main_anchor = "\ndef main() -> int:\n"
                  if main_anchor not in text:
                      raise RuntimeError("Marine trend patch could not locate main() in refresh.py.")
                  text = text.replace(
                      main_anchor,
                      "\n" + HISTORY_BLOCK.strip("\n") + "\n\n" + main_anchor.lstrip("\n"),
                      1,
                  )
                  changed = True
              elif has_snapshot and has_update:
                  text, upgraded = patch_existing_snapshot_function(text)
                  changed = changed or upgraded
                  if REFRESH_MARKER not in text:
                      marker_pos = text.index("def calculate_kpi_snapshot(")
                      text = text[:marker_pos] + REFRESH_MARKER + "\n" + text[marker_pos:]
                      changed = True
              else:
                  raise RuntimeError(
                      "refresh.py contains only part of a KPI-history implementation; refusing a partial upgrade."
                  )

              if "history = update_kpi_history(previous, incidents, lgas)" not in text:
                  data_anchor = "    data = {\n"
                  if data_anchor not in text:
                      raise RuntimeError("Marine trend patch could not locate the dashboard data dictionary.")
                  text = text.replace(
                      data_anchor,
                      "    history = update_kpi_history(previous, incidents, lgas)\n\n" + data_anchor,
                      1,
                  )
                  changed = True

              if '"history": history,' not in text:
                  incidents_anchor = '        "incidents": incidents,\n'
                  if incidents_anchor not in text:
                      raise RuntimeError("Marine trend patch could not locate the incidents field in dashboard data.")
                  text = text.replace(
                      incidents_anchor,
                      incidents_anchor + '        "history": history,\n',
                      1,
                  )
                  changed = True

              required = (
                  "def calculate_kpi_snapshot(",
                  "def update_kpi_history(",
                  '"marine": len(marine),',
                  "history = update_kpi_history(previous, incidents, lgas)",
                  '"history": history,',
              )
              for token in required:
                  if token not in text:
                      raise RuntimeError(f"Marine trend refresh validation failed: missing {token!r}.")

              compile(text, str(REFRESH), "exec")
              return text, changed


          def patch_index(text: str) -> tuple[str, bool]:
              changed = False
              marine_card_pattern = re.compile(
                  r'(?ms)(<article\b[^>]*data-kpi-sector=["\']marine["\'][^>]*>.*?</article>)'
              )
              cards = list(marine_card_pattern.finditer(text))
              if len(cards) != 1:
                  raise RuntimeError(f"Marine trend patch expected one Marine KPI card; found {len(cards)}.")

              card_match = cards[0]
              card = card_match.group(1)
              if 'id="marineTrend"' not in card:
                  detail_match = re.search(
                      r'(?m)^(?P<indent>\s*)<div class="metric-detail" id="marineDetail"[^>]*>.*?</div>\s*$',
                      card,
                  )
                  if detail_match:
                      insert_at = detail_match.end()
                      indent = detail_match.group("indent")
                  else:
                      close_index = card.rfind("</article>")
                      if close_index < 0:
                          raise RuntimeError("Marine trend patch could not find the Marine card insertion point.")
                      insert_at = close_index
                      indent = "          "
                  trend_html = (
                      f'\n{indent}{INDEX_MARKER}\n'
                      f'{indent}<div class="metric-trend trend-pending" id="marineTrend" aria-live="polite">'
                      '<span class="trend-copy"><span class="trend-direction">Collecting trend</span></span></div>'
                  )
                  card = card[:insert_at] + trend_html + card[insert_at:]
                  text = text[:card_match.start()] + card + text[card_match.end():]
                  changed = True

              config_pattern = re.compile(
                  r"(?ms)(const\s+KPI_TREND_CONFIG\s*=\s*Object\.freeze\(\s*\{)(.*?)(\}\s*\)\s*;)"
              )
              config_match = config_pattern.search(text)
              if not config_match:
                  raise RuntimeError("Marine trend patch could not locate KPI_TREND_CONFIG.")
              config_body = config_match.group(2)
              marine_config_re = re.compile(
                  r"\bmarine\s*:\s*\{[^}]*elementId\s*:\s*['\"]marineTrend['\"]"
              )
              if not marine_config_re.search(config_body):
                  lga_match = re.search(r"(?m)^(?P<indent>\s*)lgas\s*:\s*\{", config_body)
                  if lga_match:
                      insert_at = lga_match.start()
                      indent = lga_match.group("indent")
                  else:
                      insert_at = len(config_body)
                      indent_match = re.search(r"(?m)^(\s*)[A-Za-z_][A-Za-z0-9_]*\s*:\s*\{", config_body)
                      indent = indent_match.group(1) if indent_match else "      "
                  marine_config = (
                      f"{indent}marine:{{elementId:'marineTrend',field:'marine',hours:24,label:'Marine warnings'}},\n"
                  )
                  config_body = config_body[:insert_at] + marine_config + config_body[insert_at:]
                  text = text[:config_match.start(2)] + config_body + text[config_match.end(2):]
                  changed = True

              old_comment = "// fast-moving power and rail (1h), roads/LGAs (6h), and schools (24h)."
              new_comment = "// fast-moving power and rail (1h), roads/LGAs (6h), and schools/marine (24h)."
              if old_comment in text:
                  text = text.replace(old_comment, new_comment, 1)
                  changed = True

              required = ('id="marineTrend"', "field:'marine'", "hours:24")
              for token in required:
                  if token not in text:
                      raise RuntimeError(f"Marine trend index validation failed: missing {token!r}.")
              if text.count('id="marineTrend"') != 1:
                  raise RuntimeError("Marine trend index validation failed: marineTrend must occur exactly once.")
              return text, changed


          def main() -> int:
              if not REFRESH.exists() or not INDEX.exists():
                  raise SystemExit("Marine trend patch requires refresh.py and index.html.")
              refresh_original = REFRESH.read_text(encoding="utf-8")
              index_original = INDEX.read_text(encoding="utf-8")
              try:
                  refresh_patched, refresh_changed = patch_refresh(refresh_original)
                  index_patched, index_changed = patch_index(index_original)
              except Exception as exc:
                  raise SystemExit(f"Marine KPI trend patch aborted without writing files: {exc}") from exc

              if refresh_changed:
                  REFRESH.write_text(refresh_patched, encoding="utf-8")
              if index_changed:
                  INDEX.write_text(index_patched, encoding="utf-8")

              if refresh_changed or index_changed:
                  print("Marine KPI trend enabled: KPI history installed/preserved and 24-hour Marine trend added.")
              else:
                  print("Marine KPI trend is already enabled; no changes required.")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          python /tmp/apply_marine_trend.py
          python -m py_compile refresh.py

