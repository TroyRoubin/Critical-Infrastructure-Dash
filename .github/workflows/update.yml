      - name: Save latest snapshot in the repository
        shell: bash
        run: |
          set -euo pipefail

          GOOD_REFRESH_COMMIT="a30369b2f3308aaad9fb448744a9f6aa0411e38f"

          repair_refresh() {
            if [[ ! -f refresh.py ]] || \
               grep -q 'Apply the Critical Infrastructure Dashboard QLDTraffic KPI fix' refresh.py || \
               ! grep -q 'Refresh the data embedded in index.html' refresh.py; then
