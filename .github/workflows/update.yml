          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add refresh.py index.html

          if git diff --cached --quiet; then
            echo "No snapshot or parser change to commit."
            exit 0
          fi

          git commit -m "data: refresh dashboard [skip ci]"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} of 3"

            if git push origin HEAD:main; then
              echo "Dashboard snapshot pushed successfully."
              exit 0
            fi

            echo "Remote main changed. Rebuilding against latest main."

            git fetch origin main
            git reset --hard origin/main

            repair_refresh
            python /tmp/apply_qldtraffic_filter.py
            python /tmp/apply_marine_kpi.py
            python /tmp/apply_msq_verified_source.py
            python /tmp/apply_marine_trend.py
            python -m py_compile refresh.py
            python refresh.py
            python /tmp/apply_multi_lga.py
            python /tmp/apply_marine_details_ui.py
            python /tmp/rename_dashboard.py
            git add refresh.py index.html

            if git diff --cached --quiet; then
              echo "Latest main already contains equivalent dashboard data."
              exit 0
            fi

            git commit -m "data: refresh dashboard [skip ci]"
            sleep $((attempt * 2))
          done

          echo "Unable to push refreshed dashboard after three attempts."
          exit 1

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
