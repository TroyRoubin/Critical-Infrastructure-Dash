name: Refresh and deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - refresh.py
      - requirements.txt
      - .github/workflows/update.yml
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: qld-dashboard-main
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get latest repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install playwright

          # Prefer the browser already present on GitHub-hosted Ubuntu runners; fall back to Playwright Chromium.
          if command -v google-chrome >/dev/null 2>&1; then
            echo "MSQ_BROWSER_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "MSQ_BROWSER_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "MSQ_BROWSER_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi

      - name: Apply QLDTraffic Queensland-only filter
        shell: bash
        run: |
          set -euo pipefail

          GOOD_REFRESH_COMMIT="a30369b2f3308aaad9fb448744a9f6aa0411e38f"

          repair_refresh() {
            if [[ ! -f refresh.py ]]; then
              echo "refresh.py is missing; restoring known-good version."
              git show "${GOOD_REFRESH_COMMIT}:refresh.py" > refresh.py
              return
            fi

            if grep -q 'Apply the Critical Infrastructure Dashboard QLDTraffic KPI fix' refresh.py; then
              echo "refresh.py contains the old patch-helper; restoring dashboard refresher."
              git show "${GOOD_REFRESH_COMMIT}:refresh.py" > refresh.py
              return
            fi

            if ! grep -q 'Refresh the data embedded in index.html' refresh.py; then
              echo "refresh.py does not look like the dashboard refresher; restoring it."
              git show "${GOOD_REFRESH_COMMIT}:refresh.py" > refresh.py
            fi
          }

          cat > /tmp/apply_qldtraffic_filter.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re

          path = Path("refresh.py")
          text = path.read_text(encoding="utf-8")

          marker = "# QLDTraffic filter: Hazard + Flooding only"
          qld_marker = "# Queensland-only road geography filter"

          new_roads = r'''
          # QLDTraffic filter: Hazard + Flooding only
          # Queensland-only road geography filter
          QLDTRAFFIC_ALLOWED_EVENT_CATEGORIES = {"hazard", "flooding"}

          # Fast coarse bounds used before the exact Queensland LGA check.
          # Coordinates are GeoJSON order: [longitude, latitude].
          QLDTRAFFIC_QLD_BOUNDS = {
              "min_lon": 137.8,
              "max_lon": 153.7,
              "min_lat": -29.25,
              "max_lat": -9.0,
          }


          def qldtraffic_event_category(properties: dict[str, Any]) -> str | None:
              category = norm(properties.get("event_type"))
              return category if category in QLDTRAFFIC_ALLOWED_EVENT_CATEGORIES else None


          def qldtraffic_in_qld_bounds(point: list[float] | None) -> bool:
              if not point or len(point) < 2:
                  return False
              lon, lat = float(point[0]), float(point[1])
              return (
                  QLDTRAFFIC_QLD_BOUNDS["min_lon"] <= lon <= QLDTRAFFIC_QLD_BOUNDS["max_lon"]
                  and QLDTRAFFIC_QLD_BOUNDS["min_lat"] <= lat <= QLDTRAFFIC_QLD_BOUNDS["max_lat"]
              )


          def qldtraffic_coordinate_in_queensland(
              point: list[float] | None,
              lgas: dict[str, Any],
          ) -> tuple[bool, str | None]:
              if not qldtraffic_in_qld_bounds(point):
                  return False, None

              # When the embedded Queensland LGA polygons are available, use
              # them as the authoritative state-boundary test.
              if lgas.get("features"):
                  lga = locate_lga(point, lgas)
                  return (lga is not None), lga

              # If LGA geometry is temporarily unavailable, retain the coarse
              # Queensland bounding-box safeguard rather than displaying
              # obviously interstate records.
              return True, None


          def qldtraffic_location_in_queensland(
              geometry: dict[str, Any] | None,
              lgas: dict[str, Any],
          ) -> tuple[list[float] | None, str | None]:
              # Try the representative point first. For line/polygon events near
              # a border, also sample several actual geometry vertices so a
              # centroid outside Queensland does not discard a valid QLD event.
              candidates: list[list[float]] = []

              representative = representative_point(geometry)
              if representative:
                  candidates.append(representative)

              points = all_points(geometry)
              if points:
                  indexes = (
                      0,
                      len(points) // 4,
                      len(points) // 2,
                      (3 * len(points)) // 4,
                      len(points) - 1,
                  )
                  for index in indexes:
                      point = points[index]
                      if point not in candidates:
                          candidates.append(point)

              for point in candidates:
                  inside, lga = qldtraffic_coordinate_in_queensland(point, lgas)
                  if inside:
                      return point, lga

              return None, None


          def qldtraffic_fallback_records(
              records: list[dict[str, Any]],
              lgas: dict[str, Any],
          ) -> list[dict[str, Any]]:
              # Cached road records must satisfy BOTH the event-category filter
              # and the Queensland geography filter.
              filtered = []
              for item in records:
                  category = norm(item.get("event_category") or item.get("event_type"))
                  if category not in QLDTRAFFIC_ALLOWED_EVENT_CATEGORIES:
                      continue

                  inside, _ = qldtraffic_coordinate_in_queensland(
                      item.get("coordinates"),
                      lgas,
                  )
                  if inside:
                      filtered.append(item)

              return filtered


          def parse_roads(payload: dict[str, Any], lgas: dict[str, Any]) -> list[dict[str, Any]]:
              incidents = []

              for feature in payload.get("features", []):
                  props = feature.get("properties") or {}

                  # KPI inclusion filter: QLDTraffic Hazards + Flooding only.
                  event_category = qldtraffic_event_category(props)
                  if event_category is None:
                      continue

                  if norm(props.get("status")) not in {"", "active", "published"}:
                      continue

                  duration = props.get("duration") or {}
                  if not active_now(duration.get("start"), duration.get("end")):
                      continue

                  summary = props.get("road_summary") or {}
                  geometry = feature.get("geometry")

                  # Map/state inclusion filter: Queensland only.
                  coords, qld_lga = qldtraffic_location_in_queensland(geometry, lgas)
                  if coords is None:
                      continue

                  impact = props.get("impact") or {}
                  impact_type = clean(impact.get("impact_type"))
                  impact_subtype = clean(impact.get("impact_subtype"))
                  combined = norm(f"{impact_type} {impact_subtype}")

                  if "closure" in combined or "closed" in combined:
                      subtype = "closure"
                  elif "lane" in combined or "restriction" in combined:
                      subtype = "restriction"
                  else:
                      subtype = "incident"

                  # Prefer the LGA proved by the Queensland polygon check.
                  lga = qld_lga or clean(summary.get("local_government_area"))
                  road = clean(summary.get("road_name")) or "Queensland road"

                  event_type = clean(props.get("event_type")) or title_case(event_category)
                  event_subtype = clean(props.get("event_subtype"))
                  event_due_to = clean(props.get("event_due_to"))
                  status = impact_subtype or impact_type or event_subtype or event_type

                  incidents.append({
                      "id": f"roads-{props.get('id') or stable_id(road, event_type, duration.get('start'))}",
                      "sector": "roads",
                      "subtype": subtype,
                      "event_category": event_category,
                      "event_type": event_type,
                      "event_subtype": event_subtype,
                      "event_due_to": event_due_to,
                      "title": f"{road}: {status or event_type}",
                      "description": clean(props.get("description")),
                      "status": status,
                      "lga": lga,
                      "locality": clean(summary.get("locality")),
                      "coordinates": coords,
                      "geometry": geometry,
                      "customers": 0,
                      "planned": False,
                      "updated": iso(props.get("last_updated")) or NOW_ISO,
                      "source_name": "QLDTraffic",
                      "source_url": clean(props.get("url") or props.get("web_link"))
                          or SOURCES["qldtraffic"]["url"],
                  })

              return incidents


          '''

          # If the earlier Hazard/Flooding block is already present, replace the
          # entire block with this Queensland-only version. This makes v3 update
          # an existing v2 installation rather than silently doing nothing.
          if marker in text:
              block_pattern = re.compile(
                  r"(?ms)^# QLDTraffic filter: Hazard \+ Flooding only\n.*?"
                  r"(?=^def property_value\()"
              )
              match = block_pattern.search(text)
              if not match:
                  raise SystemExit("Could not locate the existing QLDTraffic filter block.")
              text = text[:match.start()] + new_roads + text[match.end():]
          else:
              parse_pattern = re.compile(
                  r"(?ms)^def parse_roads\([^\n]*\)"
                  r"(?:\s*->\s*[^:\n]+)?"
                  r":\n.*?"
                  r"(?=^def [A-Za-z_][A-Za-z0-9_]*\(|\Z)"
              )
              match = parse_pattern.search(text)
              if not match:
                  raise SystemExit("Could not locate parse_roads() in refresh.py.")
              text = text[:match.start()] + new_roads + text[match.end():]

          # Upgrade the cached QLDTraffic fallback to apply the same QLD boundary
          # check. This also cleans out any previously embedded interstate roads.
          text = text.replace(
              "qldtraffic_fallback_records(previous_by_source.get(key, []))",
              "qldtraffic_fallback_records(previous_by_source.get(key, []), lgas)",
          )

          if "qldtraffic_fallback_records(previous_by_source.get(key, []), lgas)" not in text:
              fallback_pattern = re.compile(
                  r"(?m)^(?P<indent>[ \t]+)fallback = previous_by_source\.get\(key, \[\]\)[ \t]*$"
              )
              match = fallback_pattern.search(text)
              if not match:
                  raise SystemExit("Could not locate the source fallback in refresh.py.")

              indent = match.group("indent")
              replacement = (
                  f"{indent}fallback = (\n"
                  f"{indent}    qldtraffic_fallback_records(previous_by_source.get(key, []), lgas)\n"
                  f'{indent}    if key == "qldtraffic"\n'
                  f"{indent}    else previous_by_source.get(key, [])\n"
                  f"{indent})"
              )
              text = text[:match.start()] + replacement + text[match.end():]

          required = [
              marker,
              qld_marker,
              '"event_category": event_category',
              'QLDTRAFFIC_ALLOWED_EVENT_CATEGORIES = {"hazard", "flooding"}',
              "qldtraffic_location_in_queensland(geometry, lgas)",
              "qldtraffic_fallback_records(previous_by_source.get(key, []), lgas)",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"QLDTraffic patch validation failed: missing {token}")

          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          print("QLDTraffic filter applied: Hazard + Flooding, Queensland only.")
          PY

          repair_refresh
          python /tmp/apply_qldtraffic_filter.py
          python -m py_compile refresh.py


      - name: Capture MSQ imsBulletin current warnings v9
        id: msq_capture
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/capture_msq_current.py <<'PY'
          #!/usr/bin/env python3
          """Capture MSQ current warnings from Guardian's structured imsBulletin feed.

          The Guardian dashboard itself calls /dashboard/imsBulletin to populate "Latest Warnings".
          This script uses a browser session only to establish the same public dashboard context and
          capture/fetch that JSON response. Warning records are then parsed from the FeatureCollection
          fields directly; no warning-symbol legend text or modal/card heuristics are used.
          """
          from __future__ import annotations

          from datetime import datetime, timezone
          from html.parser import HTMLParser
          import json
          import os
          from pathlib import Path
          import re
          import traceback
          from typing import Any

          from playwright.sync_api import sync_playwright

          URL = "https://qldmaritime.msq.qld.gov.au/"
          ENDPOINT_PATH = "/dashboard/imsBulletin"
          OUT = Path("/tmp/msq-current-warnings.json")
          DIAGNOSTIC = Path("/tmp/msq-current-diagnostic.json")
          BULLETIN = Path("/tmp/msq-imsBulletin.json")
          SCREENSHOT = Path("/tmp/msq-current-dashboard.png")

          AREA_ALIASES: tuple[tuple[str, tuple[str, ...]], ...] = (
              ("Rockhampton / Fitzroy River", ("rockhampton", "fitzroy river", "port alma")),
              ("Gladstone", ("gladstone", "port curtis", "fishermans landing", "fisherman's landing", "fisherman’s landing")),
              ("Bundaberg / Burnett River", ("bundaberg", "burnett river")),
              ("Hervey Bay", ("hervey bay",)),
              ("Wide Bay", ("wide bay", "tin can bay")),
              ("Mooloolaba / Mooloolah River", ("mooloolaba", "mooloolah river")),
              ("Maroochy River", ("maroochy river", "maroochydore")),
              ("Noosa", ("noosa",)),
              ("Pumicestone Passage", ("pumicestone passage", "golden beach", "bribie island")),
              ("Moreton Bay", ("moreton bay", "cape moreton", "moreton island")),
              ("Port of Brisbane", ("port of brisbane", "brisbane pilotage", "brisbane port")),
              ("Redland Bay", ("redland bay", "weinam creek", "weinam")),
              ("Southport / Gold Coast", ("southport", "gold coast seaway", "gold coast")),
              ("Mackay", ("mackay",)),
              ("Hay Point", ("hay point",)),
              ("Whitsundays", ("whitsunday", "airlie beach")),
              ("Bowen", ("bowen",)),
              ("Abbot Point", ("abbot point",)),
              ("Townsville", ("townsville",)),
              ("Lucinda / Hinchinbrook", ("lucinda", "hinchinbrook")),
              ("Mourilyan", ("mourilyan",)),
              ("Cairns", ("cairns",)),
              ("Port Douglas", ("port douglas",)),
              ("Daintree River", ("daintree river",)),
              ("Cooktown", ("cooktown",)),
              ("Cape Flattery", ("cape flattery",)),
              ("Weipa", ("weipa",)),
              ("Amrun", ("amrun",)),
              ("Skardon River", ("skardon river",)),
              ("Thursday Island / Torres Strait", ("thursday island", "torres strait")),
              ("Karumba", ("karumba",)),
              ("Gulf of Carpentaria", ("gulf of carpentaria",)),
          )

          QLD_BOUNDS = {"min_lon": 137.8, "max_lon": 154.2, "min_lat": -29.3, "max_lat": -9.0}


          def clean(value: Any) -> str:
              return re.sub(r"\s+", " ", str(value or "").replace("\u200b", " ")).strip()


          def key(value: Any) -> str:
              return clean(value).casefold()


          class _BulletinHTMLParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.parts: list[str] = []
                  self.links: list[str] = []

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  if tag.lower() in {"br", "p", "div", "li", "tr"}:
                      self.parts.append("\n")
                  if tag.lower() == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)

              def handle_endtag(self, tag: str) -> None:
                  if tag.lower() in {"p", "div", "li", "tr"}:
                      self.parts.append("\n")

              def handle_data(self, data: str) -> None:
                  self.parts.append(data)


          def html_text_and_links(value: Any) -> tuple[str, list[str]]:
              parser = _BulletinHTMLParser()
              parser.feed(str(value or ""))
              return clean(" ".join(parser.parts)), parser.links


          def areas_in_text(value: str) -> list[str]:
              lowered = key(value)
              return [
                  canonical
                  for canonical, aliases in AREA_ALIASES
                  if any(alias in lowered for alias in aliases)
              ]


          def fallback_area_from_title(title: str) -> str:
              parts = [clean(part) for part in re.split(r"\s+[-–—]\s+", title) if clean(part)]
              if len(parts) >= 2:
                  return " - ".join(parts[1:])[:180]
              return clean(title)[:180]


          def dotnet_date_to_iso(value: Any) -> str:
              match = re.search(r"/Date\((\d+)", str(value or ""))
              if not match:
                  return ""
              try:
                  return datetime.fromtimestamp(int(match.group(1)) / 1000.0, tz=timezone.utc).isoformat()
              except (OverflowError, OSError, ValueError):
                  return ""


          def _qld_point(point: list[float]) -> bool:
              return (
                  QLD_BOUNDS["min_lon"] <= point[0] <= QLD_BOUNDS["max_lon"]
                  and QLD_BOUNDS["min_lat"] <= point[1] <= QLD_BOUNDS["max_lat"]
              )


          def dms_points(value: str) -> list[list[float]]:
              component_re = re.compile(
                  r"(\d{1,3})\s*[°º]\s*(\d{1,2}(?:\.\d+)?)\s*(?:['′’])?\s*([NSEW])",
                  re.I,
              )
              components: list[tuple[str, float]] = []
              for match in component_re.finditer(value):
                  degrees = float(match.group(1))
                  minutes = float(match.group(2))
                  hemisphere = match.group(3).upper()
                  decimal = degrees + minutes / 60.0
                  if hemisphere in {"S", "W"}:
                      decimal *= -1
                  components.append((hemisphere, decimal))

              points: list[list[float]] = []
              for index, (hemisphere, latitude) in enumerate(components):
                  if hemisphere not in {"N", "S"}:
                      continue
                  for other_hemisphere, longitude in components[index + 1:index + 4]:
                      if other_hemisphere in {"E", "W"}:
                          point = [longitude, latitude]
                          if _qld_point(point):
                              points.append(point)
                          break
              return points


          def representative_coordinate(description: str) -> list[float] | None:
              points = dms_points(description)
              if not points:
                  return None
              return [
                  round(sum(point[0] for point in points) / len(points), 6),
                  round(sum(point[1] for point in points) / len(points), 6),
              ]


          def bulletin_action(title: str) -> str:
              parts = [clean(part) for part in re.split(r"\s+[-–—]\s+", title) if clean(part)]
              if len(parts) >= 2 and len(parts[0]) <= 80:
                  return parts[0]
              return ""


          def bulletin_record(feature: Any, published: str) -> dict[str, Any]:
              if not isinstance(feature, dict) or feature.get("type") != "Feature":
                  raise RuntimeError("imsBulletin contained a non-Feature warning record")
              properties = feature.get("properties")
              if not isinstance(properties, dict):
                  raise RuntimeError("imsBulletin Feature is missing properties")

              title = clean(properties.get("title"))
              if not title:
                  raise RuntimeError("imsBulletin warning Feature is missing its title")

              description, links = html_text_and_links(properties.get("description"))
              joined = f"{title} {description}"
              areas = areas_in_text(joined)
              area = areas[0] if areas else fallback_area_from_title(title)
              if not area:
                  raise RuntimeError(f"imsBulletin warning {title!r} has no identifiable area")

              temporal = feature.get("temporal") if isinstance(feature.get("temporal"), dict) else {}
              updated_iso = (
                  dotnet_date_to_iso(temporal.get("lastupdated"))
                  or dotnet_date_to_iso(properties.get("updated"))
                  or dotnet_date_to_iso(properties.get("created"))
                  or clean(published)
              )
              source_url = next(
                  (link for link in links if re.match(r"^https?://", clean(link), re.I)),
                  URL,
              )

              return {
                  "feature_id": clean(properties.get("id") or feature.get("id")),
                  "title": title[:220],
                  "description": description[:5000],
                  "areas": [area],
                  "area": area,
                  "alert_phase": "",
                  "warning_level": "",
                  "action": bulletin_action(title),
                  "issued_text": "",
                  "updated_iso": updated_iso,
                  "coordinates": representative_coordinate(description),
                  "location_precision": "source-area-centroid" if representative_coordinate(description) else "",
                  "status": "Current MSQ warning",
                  "source_url": source_url,
                  "source_method": "msq-imsBulletin-feature",
              }


          def write_error(message: str, diagnostic: dict[str, Any] | None = None) -> None:
              payload = {
                  "schema": "msq-browser-current-v2",
                  "status": "error",
                  "verified_zero": False,
                  "captured_at": datetime.now(timezone.utc).isoformat(),
                  "source_url": URL,
                  "warnings": [],
                  "error": clean(message)[:1800],
              }
              OUT.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
              if diagnostic is not None:
                  DIAGNOSTIC.write_text(
                      json.dumps(diagnostic, ensure_ascii=False, indent=2, default=str),
                      encoding="utf-8",
                  )
              print(f"::warning::MSQ imsBulletin unavailable: {payload['error']}")


          def main() -> int:
              captured: dict[str, Any] = {"payload": None, "url": ""}
              body_text = ""
              try:
                  with sync_playwright() as playwright:
                      browser_path = clean(os.environ.get("MSQ_BROWSER_PATH"))
                      launch_kwargs: dict[str, Any] = {"headless": True}
                      if browser_path:
                          launch_kwargs["executable_path"] = browser_path
                      browser = playwright.chromium.launch(**launch_kwargs)
                      context = browser.new_context(
                          locale="en-AU",
                          timezone_id="Australia/Brisbane",
                          viewport={"width": 1440, "height": 1000},
                      )
                      page = context.new_page()

                      def on_response(response) -> None:
                          try:
                              if ENDPOINT_PATH not in response.url:
                                  return
                              body = response.body()
                              captured["url"] = response.url
                              captured["payload"] = json.loads(body.decode("utf-8-sig"))
                          except Exception:
                              return

                      page.on("response", on_response)
                      page.goto(URL, wait_until="domcontentloaded", timeout=90_000)

                      # Give Guardian time to issue its normal imsBulletin request.
                      for _ in range(20):
                          if captured["payload"] is not None:
                              break
                          page.wait_for_timeout(500)

                      # Deterministic fallback: make the same same-origin request from the established public session.
                      if captured["payload"] is None:
                          captured["payload"] = page.evaluate(
                              r"""async path => {
                                const response = await fetch(path + '?t=' + Date.now(), {
                                  method: 'GET',
                                  credentials: 'same-origin',
                                  cache: 'no-store',
                                  headers: {'Accept':'application/json, text/plain, */*'}
                                });
                                if (!response.ok) throw new Error('imsBulletin HTTP ' + response.status);
                                return await response.json();
                              }""",
                              ENDPOINT_PATH,
                          )
                          captured["url"] = URL.rstrip("/") + ENDPOINT_PATH

                      try:
                          body_text = page.locator("body").inner_text(timeout=10_000)
                      except Exception:
                          body_text = ""
                      try:
                          page.screenshot(path=str(SCREENSHOT), full_page=True)
                      except Exception:
                          pass
                      browser.close()

                  payload = captured["payload"]
                  if not isinstance(payload, dict):
                      raise RuntimeError("imsBulletin response was not a JSON object")
                  if payload.get("type") != "FeatureCollection":
                      raise RuntimeError(f"imsBulletin returned unexpected type {payload.get('type')!r}")
                  features = payload.get("features")
                  if not isinstance(features, list):
                      raise RuntimeError("imsBulletin FeatureCollection is missing its features list")

                  expected_count: int | None = None
                  count_match = re.search(r"\b(\d+)\s+Latest\s+Warnings\b", body_text, re.I)
                  if count_match:
                      expected_count = int(count_match.group(1))

                  published = clean(payload.get("published"))
                  records = [bulletin_record(feature, published) for feature in features]

                  # Feature IDs should be unique. Duplicate IDs indicate a malformed/ambiguous feed.
                  ids = [record.get("feature_id") for record in records if record.get("feature_id")]
                  if len(ids) != len(set(ids)):
                      raise RuntimeError("imsBulletin returned duplicate warning Feature IDs")

                  diagnostic = {
                      "captured_at": datetime.now(timezone.utc).isoformat(),
                      "imsBulletin_url": captured.get("url"),
                      "dashboard_latest_warnings_count": expected_count,
                      "feature_count": len(features),
                      "parsed_warning_count": len(records),
                      "published": published,
                      "warnings": records,
                  }
                  DIAGNOSTIC.write_text(
                      json.dumps(diagnostic, ensure_ascii=False, indent=2, default=str),
                      encoding="utf-8",
                  )
                  BULLETIN.write_text(
                      json.dumps({"url": captured.get("url"), "payload": payload}, ensure_ascii=False, indent=2, default=str),
                      encoding="utf-8",
                  )

                  # Cross-check against the dashboard count when available. The structured endpoint remains
                  # authoritative when the tile text is unavailable, but disagreement is treated as an error.
                  if expected_count is not None and expected_count != len(features):
                      write_error(
                          f"MSQ dashboard reports {expected_count} Latest Warnings but imsBulletin contains {len(features)} Feature(s)",
                          diagnostic,
                      )
                      return 0

                  output = {
                      "schema": "msq-browser-current-v2",
                      "status": "current",
                      "verified_zero": len(records) == 0,
                      "captured_at": datetime.now(timezone.utc).isoformat(),
                      "published": published,
                      "source_url": captured.get("url") or URL,
                      "warnings": records,
                      "diagnostics": {
                          "dashboard_count": expected_count,
                          "feature_count": len(features),
                          "method": "imsBulletin FeatureCollection",
                      },
                  }
                  OUT.write_text(json.dumps(output, ensure_ascii=False, indent=2), encoding="utf-8")
                  print(
                      f"MSQ imsBulletin verified: {len(records)} current warning(s)"
                      + (f" (dashboard count {expected_count})." if expected_count is not None else ".")
                  )
                  for record in records:
                      point = record.get("coordinates")
                      point_text = f" @ {point[1]:.5f},{point[0]:.5f}" if point else ""
                      print(f"  - {record['area']}: {record['title']}{point_text}")
                  return 0
              except Exception as exc:
                  write_error(
                      f"{type(exc).__name__}: {exc}",
                      {"traceback": traceback.format_exc(), "imsBulletin_url": captured.get("url")},
                  )
                  return 0


          if __name__ == "__main__":
              raise SystemExit(main())
