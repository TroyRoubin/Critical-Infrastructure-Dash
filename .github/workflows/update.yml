name: Refresh dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "refresh.py"
      - "apply_qldtraffic_filter_v7.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: critical-infrastructure-dashboard-refresh-main
  cancel-in-progress: false

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Apply QLDTraffic Hazard and Flooding mode
        run: python apply_qldtraffic_filter_v7.py

      - name: Refresh dashboard data
        run: python refresh.py

      - name: Commit and push refreshed dashboard
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
            exit 0
          fi

          git commit -m "data: refresh dashboard"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} of 3"

            if git push origin HEAD:main; then
              echo "Dashboard refresh pushed successfully."
              exit 0
            fi

            echo "Remote main changed before the push completed."
            echo "Rebuilding the refreshed dashboard from the latest main branch."

            git fetch origin main
            git reset --hard origin/main

            python apply_qldtraffic_filter_v7.py
            python refresh.py
            git add index.html

            if git diff --cached --quiet; then
              echo "The latest main branch already contains equivalent dashboard data."
              exit 0
            fi

            git commit -m "data: refresh dashboard"
            sleep $((attempt * 2))
          done

          echo "Unable to push the refreshed dashboard after three attempts."
          exit 1
