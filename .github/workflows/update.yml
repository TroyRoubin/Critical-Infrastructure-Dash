              'else msq_marine_fallback_records(previous_by_source.get(key, []), lgas)',
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"Marine mapping v4 validation failed: missing {token!r}.")
          if old_job in text:
              raise SystemExit("Marine mapping v4 validation failed: old Marine job call remains.")
          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          print("Marine mapping v4 applied: Marine warnings now carry map coordinates and structured warning detail.")
          PY
          python /tmp/apply_marine_mapping.py
          python -m py_compile refresh.py

      - name: Refresh live feeds
