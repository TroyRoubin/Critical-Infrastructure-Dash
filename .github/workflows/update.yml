              count = text.count(old)
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print(f"Dashboard renamed to: {new} ({count} occurrence(s) updated).")
          elif new in text:
              print(f"Dashboard title is already: {new}")
